<script>
window.addEventListener('error', function(e) {
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#f00;color:#fff;padding:10px;z-index:99999;font-size:12px;font-family:monospace;line-height:1.5;word-break:break-all';
  box.textContent = '❌ ' + e.message + ' ｜ 第 ' + e.lineno + ' 行';
  document.body ? document.body.appendChild(box) : document.addEventListener('DOMContentLoaded', function(){document.body.appendChild(box)});
});
</script>

#mode:active{transform:scale(.95)}

#pad{position:absolute;inset:0;pointer-events:none;z-index:4}

.btn:active{transform:scale(.9);box-shadow:0 0 24px rgba(255,255,255,.7),inset 0 2px 4px rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.4)}
#btnL{left:14px;bottom:78px;width:76px;height:76px;font-size:32px}
#btnR{left:104px;bottom:78px;width:76px;height:76px;font-size:32px}
#btnJ{right:20px;bottom:170px;width:76px;height:76px;font-size:30px;background:radial-gradient(circle at 40% 30%,rgba(120,200,255,.5),rgba(40,100,180,.3));border-color:rgba(180,230,255,.75)}
#btnAtk{right:20px;bottom:78px;width:86px;height:86px;font-size:36px;background:radial-gradient(circle at 40% 30%,rgba(255,120,120,.55),rgba(160,20,20,.35));border-color:rgba(255,160,160,.8)}
#inv{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:rgba(10,10,20,.75);padding:6px;border-radius:12px;z-index:5;max-width:92vw;overflow-x:auto;scrollbar-width:none;border:1px solid rgba(255,255,255,.15);box-shadow:0 6px 20px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
#inv::-webkit-scrollbar{display:none}
.slot{width:48px;height:48px;flex:0 0 48px;border:2px solid #444;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;cursor:pointer;background:rgba(0,0,0,.4);transition:all .15s}
.slot.sel{border-color:#ffd700;box-shadow:0 0 12px #ffd700, inset 0 0 8px #ffd70055;transform:scale(1.05)}
.slot .cnt{position:absolute;bottom:2px;right:3px;font-size:11px;font-weight:900;text-shadow:1px 1px 2px #000,0 0 4px #000}
.slot .ico{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.5);box-shadow:inset 0 2px 4px rgba(255,255,255,.2)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#pop.on{display:flex}
#popBox{background:linear-gradient(180deg,#1e1235,#0e0518);border:1px solid #4a3570;border-radius:18px;max-width:420px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.8), 0 0 60px rgba(255,217,122,.15);text-align:center;max-height:88vh;overflow-y:auto;animation:popIn .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
#popBox h4{color:#ffd97a;font-size:19px;margin-bottom:12px;letter-spacing:3px;text-shadow:0 0 16px rgba(255,217,122,.5);font-weight:900}
#popBox .d{color:#c9a0ff;font-size:13px;line-height:1.9;margin-bottom:14px;text-align:left}
#popBox button{width:100%;padding:13px;margin:5px 0;background:linear-gradient(180deg,#6a4bc4,#3a1f70);border:1px solid #8a6ee0;border-radius:10px;color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 12px rgba(106,75,196,.3);transition:all .15s}
#popBox button:active{transform:scale(.97)}

#popBox button.red{background:linear-gradient(180deg,#c53030,#5a1010);border-color:#ff6666}
#toast{position:absolute;top:36%;left:50%;transform:translateX(-50%);color:#ffd700;font-size:20px;font-weight:900;text-shadow:0 0 16px #ffd700, 0 2px 4px #000;opacity:0;pointer-events:none;transition:opacity .3s;z-index:7;text-align:center;white-space:nowrap;letter-spacing:2px}
#toast.show{opacity:1}
#log{position:absolute;bottom:70px;left:12px;right:12px;max-height:60px;overflow:hidden;font-size:11px;color:#a89bc9;pointer-events:none;z-index:3;line-height:1.6;text-align:center;text-shadow:0 1px 2px #000, 0 0 6px #000}

#start{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:radial-gradient(circle,rgba(30,15,60,.95),rgba(0,0,0,.98))}

#start button.alt{background:linear-gradient(180deg,#3a3a4a,#1a1a24);border-color:#666}

}

function saveGame() {
  try {
    if (!S) return;
    S.lastSave = Date.now();
    const slim = Object.assign({}, S, { monsters: [], drops: [], trib: null });
    const str = JSON.stringify(slim);
    if (str.length > 4 * 1024 * 1024) {
      slim.changes = {};
      localStorage.setItem(SAVE_KEY, JSON.stringify(slim));
    } else {
      localStorage.setItem(SAVE_KEY, str);
    }
  } catch (e) {}
}

function loadGame() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (!s) return null;
    const data = JSON.parse(s);
    const base = newState(data.seed);
    for (const k in base) {
      if (data[k] === undefined) data[k] = base[k];
    }
    if (!data.player) data.player = base.player;
    if (!data.buffs) data.buffs = base.buffs;

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '0';
  if (!isFinite(n)) return '∞';
  if (n < 0) return '0';
  if (n < 1000) return Math.floor(n).toString();
  const u = ['','k','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad'];
  let i = 0, t = n;
  while (t >= 1000 && i < u.length - 1) { t /= 1000; i++; }
  if (t >= 1000) return n.toExponential(2);
  return t.toFixed(1) + u[i];
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function luckMul() {
  let l = 1;
  l += (S.cornLv.luck || 0) * 0.05;
  l += ((S.stLv && S.stLv.permLuck) || 0) * 0.05;
  l += (S.plv.keepLuck || 0) * 0.05;
  if (S.pet === 'cat') l += 0.03;

}
function critRate() {
  let c = 0;
  c += (S.plv.crit || 0) * 0.02;
  c += ((S.stLv && S.stLv.permCrit) || 0) * 0.02;
  c += ((S.rs && S.rs.voidEye) || 0) * 0.03;
  return Math.min(0.9, c);
}
function goldMul() {
  let g = 1;
  g *= 1 + (S.soulLv.origin_gold || 0) * 0.25;
  g *= 1 + (S.greed || 0) * 0.005;
  return g;
}
function dmgMul() {
  let d = 1;
  d *= 1 + (S.soulLv.origin_dmg || 0) * 0.2;
  d *= 1 + (S.valor || 0) * 0.01;
  d *= 1 + (S.corruption || 0) * 0.005;
  if (S.buffAtkUntil > Date.now()) d *= 2;
  if (S.buffPillAtkUntil && S.buffPillAtkUntil > Date.now()) d *= 2;
  if (S.buffs.str > Date.now()) d *= 1.8;
  if (S.pet === 'dragon') d *= 1.1;
  // 装备攻击加成
  if (S.equip) {
    for (const k in S.equip) {
      const it = S.equip[k];
      if (!it) continue;
      const info = INFO[it];
      if (!info || !info.eq) continue;
      const q = info.q || 0;
      if (info.eq === 'neck' && it === T.EQ_NECK_ATK) d *= 1.15;
      if (info.eq === 'ring' && it === T.EQ_RING_ATK) d *= 1.15;
    }
  }
  // 附魔锋利
  const wep = S.equip && S.equip.weapon;
  if (wep && S.enchant[wep] && S.enchant[wep].sharp) {
    d *= 1 + S.enchant[wep].sharp * 0.1;
  }
  return d;
}

const W = 640, H = 160, BS = 26, SEED_R = 40;
let world = [];
let biomeCache = [];

function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}
function h1(x) { return hash(x, 9931); }
function h2(x) { return hash(x, 7717); }
function h3(x) { return hash(x, 4423); }

function biomeAt(x) {
  const n = Math.sin(x * 0.008) * 0.5
          + Math.sin(x * 0.021 + 1.3) * 0.3
          + Math.sin(x * 0.053 + 2.7) * 0.2;
  if (n < -0.4) return 'snow';
  if (n < -0.05) return 'forest';
  if (n < 0.3) return 'plains';
  return 'desert';
}

const WORK_BLOCK_TYPES = [T.CRAFT_TABLE, T.FURNACE, T.ALCHEMY, T.CONTROLLER,
                          T.VOID_MINER, T.CULTIVATOR, T.ENCHANT_TABLE];

function carveCaves(surface, count) {
  for (let i = 0; i < count; i++) {
    let cx = Math.random() * W;
    let cy = SEED_R + 8 + Math.random() * (H - SEED_R - 20);
    let r = 1 + Math.random() * 1.5;
    let steps = 14 + Math.random() * 18;
    let angle = Math.random() * Math.PI * 2;
    for (let s = 0; s < steps; s++) {
      cx += Math.cos(angle) * 1.4;
      cy += Math.sin(angle) * 1.4;
      angle += (Math.random() - 0.5) * 0.5;
      const rr = r + Math.random() * 0.8;
      for (let dy = -rr; dy <= rr; dy++) {
        for (let dx = -rr; dx <= rr; dx++) {
          if (dx * dx + dy * dy <= rr * rr) {
            const px = Math.floor(cx + dx);
            const py = Math.floor(cy + dy);
            if (px > 0 && px < W - 1 && py > SEED_R + 4 && py < H - 3) {
              if (py > (surface[px] || SEED_R) + 3) {
                world[py][px] = T.AIR;
              }
            }
          }
        }
      }
    }
  }
}

function addOre(type, count, y0, y1, size) {
  for (let i = 0; i < count; i++) {
    const x = Math.floor(Math.random() * (W - 4)) + 2;
    const y = Math.floor(y0 + Math.random() * (y1 - y0));
    const sx = 1 + Math.floor(Math.random() * size);
    const sy = 1 + Math.floor(Math.random() * size);
    for (let dy = 0; dy < sy; dy++) {
      for (let dx = 0; dx < sx; dx++) {
        if (y + dy < H && x + dx < W && world[y + dy][x + dx] === T.STONE) {
          world[y + dy][x + dx] = type;
        }
      }
    }
  }
}

function generateWorld(seed) {
  world = [];
  for (let y = 0; y < H; y++) world[y] = new Array(W).fill(T.AIR);
  biomeCache = [];

  const surface = [];
  for (let x = 0; x < W; x++) {
    const bio = biomeAt(x);
    biomeCache[x] = bio;
    let base = SEED_R;
    if (bio === 'desert') base -= 2;
    else if (bio === 'snow') base += 3;
    const h = Math.floor(base
      + Math.sin(x * 0.03 + seed * 0.0001) * 3.2
      + Math.sin(x * 0.11 + seed * 0.0002) * 1.5
      + Math.sin(x * 0.37 + seed * 0.0003) * 0.8
      + (h1(x + seed) - 0.5) * 1.5);
    surface[x] = h;
  }

  for (let x = 0; x < W; x++) {
    const h = surface[x];
    const bio = biomeCache[x];
    for (let y = h; y < H; y++) {
      let t = T.STONE;
      if (y === h) {
        if (bio === 'desert') t = T.SAND;
        else if (bio === 'snow') t = T.SNOW;
        else t = T.GRASS;
      } else if (y < h + 4) {
        t = (bio === 'desert') ? T.SAND : T.DIRT;
      } else if (y < h + 6 && bio === 'desert') {
        t = T.SANDSTONE;
      }
      world[y][x] = t;
    }
    world[H - 1][x] = T.BEDROCK;
    world[H - 2][x] = T.BEDROCK;
    world[H - 3][x] = T.BEDROCK;
  }

  carveCaves(surface, 110);

  addOre(T.COAL, 360, SEED_R + 6,  H - 6, 5);
  addOre(T.IRON, 220, SEED_R + 15, H - 6, 4);
  addOre(T.GOLD, 110, SEED_R + 35, H - 6, 3);
  addOre(T.REDSTONE, 120, SEED_R + 40, H - 6, 3);
  addOre(T.DIAMOND, 44, SEED_R + 60, H - 6, 2);
  addOre(T.PAPER_ORE, 120, SEED_R + 10, H - 6, 4);
  addOre(T.LAPIS_ORE, 60, SEED_R + 20, H - 6, 3);
  addOre(T.OBSIDIAN, 30, SEED_R + 70, H - 6, 2);
  addOre(T.LAVA, 40, SEED_R + 80, H - 6, 3);

  let lastX = -10;
  const spawnCenterX = Math.floor(W / 2);
  for (let i = 0; i < 180; i++) {
    const x = Math.floor(Math.random() * W);
    if (Math.abs(x - lastX) < 3) continue;
    if (x < 4 || x > W - 5) continue;
    if (Math.abs(x - spawnCenterX) < 8) continue;
    const h = surface[x];
    const bio = biomeCache[x];
    const top = world[h][x];
    if (top !== T.GRASS && top !== T.SNOW) continue;

    if (bio === 'desert') {
      if (Math.random() < 0.5) {
        const th = 2 + Math.floor(Math.random() * 3);
        for (let dy = 1; dy <= th; dy++) world[h - dy][x] = T.CACTUS;
        if (Math.random() < 0.5) {
          world[h - th + 1][x - 1] = T.CACTUS;
          world[h - th + 1][x + 1] = T.CACTUS;
        }
      }
    } else if (bio === 'forest' || bio === 'plains') {
      const th = 4 + Math.floor(Math.random() * 3);
      for (let dy = 1; dy <= th; dy++) world[h - dy][x] = T.WOOD;
      for (let dy = -2; dy <= 1; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          if (Math.abs(dx) + Math.abs(dy) <= 3) {
            const px = x + dx, py = h - th - dy;
            if (px > 0 && px < W && py > 0 && py < H && world[py][px] === T.AIR) {
              world[py][px] = T.LEAF;
            }
          }
        }
      }
      lastX = x;
    } else if (bio === 'snow') {
      const th = 5 + Math.floor(Math.random() * 3);
      for (let dy = 1; dy <= th; dy++) world[h - dy][x] = T.WOOD;
      for (let dy = -3; dy <= 1; dy++) {
        const wdt = 3 - Math.abs(dy);
        if (wdt < 0) continue;
        for (let dx = -wdt; dx <= wdt; dx++) {
          const px = x + dx, py = h - th - dy;
          if (px > 0 && px < W && py > 0 && py < H && world[py][px] === T.AIR) {
            world[py][px] = T.LEAF;
          }
        }
      }
      lastX = x;
    }
  }

  for (let i = 0; i < 240; i++) {
    const x = Math.floor(Math.random() * W);
    const h = surface[x];
    if (world[h][x] === T.GRASS && world[h - 1] && world[h - 1][x] === T.AIR) {
      if (Math.random() < 0.4) world[h - 1][x] = T.FLOWER;
    }
  }

  for (let i = 0; i < 12; i++) {
    const x = 5 + Math.floor(Math.random() * (W - 10));
    const h = surface[x];
    if (h < SEED_R - 3) {
      for (let dx = -3; dx <= 3; dx++) {
        const px = x + dx;
        if (px < 1 || px > W - 2) continue;
        for (let dy = 0; dy < 2; dy++) {
          if (world[h + dy] && world[h + dy][px] !== T.AIR) {
            world[h + dy][px] = T.WATER;
          }
        }
      }
    }
  }

  for (let i = 0; i < 6; i++) {
    const x = 20 + Math.floor(Math.random() * (W - 40));
    const y = SEED_R + 50 + Math.floor(Math.random() * (H - SEED_R - 60));
    world[y][x] = T.ANCIENT;
    world[y][x - 1] = T.BRICK;
    world[y][x + 1] = T.BRICK;
  }

  const spawnX = Math.floor(W / 2);
  const spawnY = surface[spawnX] - 3;
  for (let dy = -12; dy <= 2; dy++) {
    for (let dx = -4; dx <= 4; dx++) {
      const tx = spawnX + dx;
      const ty = spawnY + dy;
      if (tx < 1 || tx >= W - 1 || ty < 1 || ty >= H - 1) continue;
      if (dy <= -1) {
        world[ty][tx] = T.AIR;
      }
    }
  }
  for (let dx = -2; dx <= 2; dx++) {
    const tx = spawnX + dx;
    const ty = spawnY + 2;
    if (tx < 0 || tx >= W) continue;
    if (world[ty][tx] === T.AIR) {
      world[ty][tx] = (biomeCache[tx] === 'desert') ? T.SAND : T.GRASS;
    }
  }

  return { x: spawnX, y: spawnY, surface };
}

function getBlock(x, y) {
  if (x < 0 || x >= W || y < 0 || y >= H) return T.BEDROCK;
  const key = x + ',' + y;
  if (S && S.changes[key] !== undefined) return S.changes[key];
  return world[y] ? world[y][x] : T.AIR;
}

function setBlock(x, y, t) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  if (!S) return;
  S.changes[x + ',' + y] = t;
}

function isSolid(x, y) {
  const t = getBlock(x, y);
  return t !== T.AIR && t !== T.LEAF && t !== T.WATER && t !== T.FLOWER
      && t !== T.PAPER_PLANT && t !== T.CROP && t !== T.DOOR
      && t !== T.PORTAL;
}

// =====================
// 天气
// =====================
const WEATHER_TYPES = ['clear', 'rain', 'storm', 'sand'];

function weatherName(w) {
  return { clear:'☀️ 晴朗', rain:'🌧 下雨', storm:'⛈ 雷暴', sand:'🌪 沙尘暴' }[w] || '☀️';
}

function updateWeather(dt) {
  if (!S) return;
  S.weatherT += dt;
  if (S.weatherT >= S.weatherDur) {
    S.weatherT = 0;
    S.weatherDur = 60 + Math.random() * 120;
    const r = Math.random();
    let next = 'clear';
    if (r < 0.1) next = 'rain';
    else if (r < 0.13) next = 'storm';
    else if (r < 0.16) next = 'sand';
    if (next !== S.weather) {
      S.weather = next;
      const wname = weatherName(next);
      toast(wname);
      log('天气：' + wname);
    }
  }
  // 雷暴闪电
  if (S.weather === 'storm' && Math.random() < 0.005) {
    const px = Math.floor(S.player.x / BS);
    const py = Math.floor(S.player.y / BS);
    const tx = px + Math.floor((Math.random() - 0.5) * 30);
    const ty = py + Math.floor((Math.random() - 0.5) * 10);
    if (tx > 0 && tx < W && ty > 0 && ty < H) {
      const t = getBlock(tx, ty);
      if (t !== T.BEDROCK && t !== T.AIR) {
        setBlock(tx, ty, T.AIR);
        addDrop(tx, ty, DROP[t] || t, 1);
      }
    }
  }
}
let camera = { x: 0, y: 0 };

function updateCamera(dt) {
  if (!S) return;
  const p = S.player;
  const targetX = p.x + p.w / 2 - cv.width / 2;
  const targetY = p.y + p.h / 2 - cv.height / 2;
  camera.x += (targetX - camera.x) * 0.18;
  camera.y += (targetY - camera.y) * 0.18;
}

function dayLight() {
  return 0.5 + 0.5 * Math.sin(S.dayT * Math.PI * 2);
}

let cv, ctx;
function initCanvas() {
  cv = document.getElementById('cv');
  ctx = cv.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
}
function resize() {
  if (!cv) return;
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  if (S && S.player) {
    camera.x = S.player.x - cv.width / 2;
    camera.y = S.player.y - cv.height / 2;
  }
}

function render() {
  if (!S || !ctx) return;
  const light = dayLight();
  const p = S.player;

  let r = Math.floor(15 + 90 * light);
  let g = Math.floor(30 + 130 * light);
  let b = Math.floor(55 + 160 * light);
  if (S.buffs.bloodmoonUntil > Date.now()) {
    r = Math.floor(r * 1.4);
    g = Math.floor(g * 0.5);
    b = Math.floor(b * 0.5);
  }
  if (S.weather === 'sand') {
    r = Math.floor(r * 1.3 + 40);
    g = Math.floor(g * 1.1 + 30);
    b = Math.floor(b * 0.6);
  } else if (S.weather === 'rain' || S.weather === 'storm') {
    r = Math.floor(r * 0.7);
    g = Math.floor(g * 0.75);
    b = Math.floor(b * 0.9);
  }
  ctx.fillStyle = `rgb(${Math.min(255,r)},${Math.min(255,g)},${Math.min(255,b)})`;
  ctx.fillRect(0, 0, cv.width, cv.height);

  const cx = cv.width / 2, cy = cv.height / 2;
  const ang = S.dayT * Math.PI * 2 - Math.PI / 2;
  const sunX = cx + Math.cos(ang) * cv.width * 0.7;
  const sunY = cy + Math.sin(ang) * cv.height * 0.7;
  if (light > 0.2 && S.weather !== 'sand') {
    ctx.fillStyle = S.buffs.bloodmoonUntil > Date.now() ? '#ff3030' : '#fff5a0';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 40;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (light < 0.4 && S.weather !== 'sand') {
    const a = (0.4 - light) / 0.4;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    for (let i = 0; i < 70; i++) {
      const sx = (h1(i) * cv.width + camera.x * 0.05) % cv.width;
      const sy = h2(i) * cv.height * 0.6;
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  const x0 = Math.max(0, Math.floor(camera.x / BS) - 1);
  const y0 = Math.max(0, Math.floor(camera.y / BS) - 1);
  const x1 = Math.min(W - 1, Math.ceil((camera.x + cv.width) / BS) + 1);
  const y1 = Math.min(H - 1, Math.ceil((camera.y + cv.height) / BS) + 1);

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const t = getBlock(x, y);
      if (t === T.AIR) continue;
      drawBlock(x, y, t);
    }
  }

  // 传送门
  for (const pt of S.portals) {
    const px = pt.x * BS - camera.x;
    const py = pt.y * BS - camera.y;
    if (px < -BS * 2 || px > cv.width + BS * 2) continue;
    ctx.fillStyle = 'rgba(160,60,255,.7)';
    ctx.shadowColor = '#c060ff';
    ctx.shadowBlur = 20;
    ctx.fillRect(px, py, BS * 2, BS * 3);
    ctx.shadowBlur = 0;
  }

  for (const d of S.drops) {
    const px = d.x - camera.x;
    const py = d.y - camera.y;
    if (px < -BS || px > cv.width + BS) continue;
    const info = INFO[d.type];
    if (!info) continue;
    const bob = Math.sin(performance.now() / 200) * 2;
    ctx.fillStyle = info.c;
    ctx.fillRect(px, py + bob, BS * 0.65, BS * 0.65);
    ctx.strokeStyle = 'rgba(0,0,0,.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + bob + 0.5, BS * 0.65 - 1, BS * 0.65 - 1);
    if (info.glow) {
      ctx.shadowColor = info.glow;
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#fff';
      ctx.fillRect(px + 3, py + bob + 3, 3, 3);
      ctx.shadowBlur = 0;
    }
  }

  for (const m of S.monsters) {
    const px = m.x - camera.x;
    const py = m.y - camera.y;
    if (px < -BS * 2 || px > cv.width + BS * 2) continue;
    drawMonster(px, py, m.w, m.h, m);
  }

  if (S.boss) {
    const b = S.boss;
    const px = b.x - camera.x;
    const py = b.y - camera.y;
    drawBoss(px, py, b.w, b.h, b);
  }

  // NPC
  for (const n of S.npcs) {
    const px = n.x * BS - camera.x;
    const py = n.y * BS - camera.y;
    if (px < -BS * 2 || px > cv.width + BS * 2) continue;
    ctx.fillStyle = n.color || '#a08060';
    ctx.fillRect(px + 4, py + 8, BS - 8, BS - 4);
    ctx.fillStyle = '#e8c8a8';
    ctx.fillRect(px + 4, py - 4, BS - 8, BS * 0.5);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(n.icon || '?', px + 6, py + BS * 0.7);
  }

  for (const f of S.fields) {
    const px = f.x * BS - camera.x;
    const py = f.y * BS - camera.y;
    if (px < -BS || px > cv.width + BS) continue;
    const ripe = (f.grow || 0) >= 1;
    const sz = 0.4 + Math.min(1, f.grow || 0) * 0.6;
    ctx.fillStyle = ripe ? '#88e860' : '#68a848';
    const w = BS * 0.7 * sz;
    const h = BS * 0.9 * sz;
    ctx.fillRect(px + (BS - w) / 2, py + BS - h, w, h);
    if (ripe) {
      ctx.shadowColor = '#88e860';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#e8ffc0';
      ctx.beginPath();
      ctx.arc(px + BS / 2, py + BS * 0.4, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  drawPlayer();

  // 宠物跟随
  if (S.pet) {
    const px = S.player.x - camera.x - 30;
    const py = S.player.y - camera.y - 10;
    ctx.font = '20px sans-serif';
    const icons = { dog:'🐕', cat:'🐱', ghost:'👻', dragon:'🐉', paper:'📄' };
    ctx.fillText(icons[S.pet] || '?', px, py);
  }

  // 钓鱼浮标
  if (S.fishing && S.fishing.state === 'waiting') {
    const px = S.player.x - camera.x + 60 * S.player.facing;
    const py = S.player.y - camera.y + 30;
    const bob = Math.sin(performance.now() / 300) * 3;
    ctx.fillStyle = '#ff3030';
    ctx.beginPath();
    ctx.arc(px, py + bob, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(S.player.x - camera.x + 13, S.player.y - camera.y + 5);
    ctx.lineTo(px, py + bob);
    ctx.stroke();
  }

  if (pointerDown && mineTarget && mineProgress > 0) {
    const px = mineTarget.x * BS - camera.x;
    const py = mineTarget.y * BS - camera.y;
    ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, BS - 2, BS - 2);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const barH = 6;
    ctx.fillRect(px + 1, py + BS - barH - 1, (BS - 2) * Math.min(1, mineProgress), barH);
  }

  if (pointerDown) {
    const p2 = pointerCell(pointerX, pointerY);
    if (inReach(p2.bx, p2.by)) {
      const px = p2.bx * BS - camera.x;
      const py = p2.by * BS - camera.y;
      let color = 'rgba(255,80,80,.9)';
      if (S.mode === 'place') color = 'rgba(80,255,80,.9)';
      else if (S.mode === 'build') color = 'rgba(255,150,255,.9)';
      else if (S.mode === 'sow') color = 'rgba(255,220,80,.9)';
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 1, py + 1, BS - 2, BS - 2);
      const alpha = 0.12 + Math.sin(performance.now() / 180) * 0.08;
      let fillC = 'rgba(255,80,80,' + alpha + ')';
      if (S.mode === 'place') fillC = 'rgba(80,255,80,' + alpha + ')';
      else if (S.mode === 'build') fillC = 'rgba(255,150,255,' + alpha + ')';
      else if (S.mode === 'sow') fillC = 'rgba(255,220,80,' + alpha + ')';
      ctx.fillStyle = fillC;
      ctx.fillRect(px + 1, py + 1, BS - 2, BS - 2);
    }
  }

  if (p.hurtFlash > 0) {
    ctx.fillStyle = `rgba(255,0,0,${p.hurtFlash * 1.5})`;
    ctx.fillRect(0, 0, cv.width, cv.height);
  }

  // 天气叠加
  if (S.weather === 'rain' || S.weather === 'storm') {
    ctx.strokeStyle = 'rgba(180,200,255,.4)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 60; i++) {
      const rx = (h1(i * 7) * cv.width + performance.now() / 20 * (i % 3 + 1)) % cv.width;
      const ry = (h2(i * 11) * cv.height + performance.now() / 10) % cv.height;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - 2, ry + 10);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(20,30,60,.25)';
    ctx.fillRect(0, 0, cv.width, cv.height);
  } else if (S.weather === 'sand') {
    ctx.fillStyle = 'rgba(180,140,60,.35)';
    ctx.fillRect(0, 0, cv.width, cv.height);
  } else if (light < 0.4 && !S.buffs.bloodmoonUntil) {
    const alpha = (0.4 - light) * 0.6;
    ctx.fillStyle = `rgba(0,0,20,${alpha})`;
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
}

const BLOCK_CACHE = {};
const CACHE_SIZE = 26;

function buildBlockCache() {
  for (const t in INFO) {
    const type = parseInt(t);
    if (type === T.AIR) continue;
    const cv2 = document.createElement('canvas');
    cv2.width = CACHE_SIZE;
    cv2.height = CACHE_SIZE;
    const c2 = cv2.getContext('2d');
    renderBlockTo(c2, 0, 0, type, CACHE_SIZE);
    BLOCK_CACHE[type] = cv2;
  }
}

function renderBlockTo(c, px, py, t, SZ) {
  const info = INFO[t];
  if (!info) return;
  c.fillStyle = info.c;
  c.fillRect(px, py, SZ, SZ);

  if (t === T.GRASS) {
    c.fillStyle = info.d;
    c.fillRect(px, py + SZ * 0.35, SZ, SZ * 0.65);
    c.fillStyle = '#8ad06a';
    for (let i = 0; i < 3; i++) {
      const tx = px + h1(i * 10 + t) * (SZ - 3);
      c.fillRect(tx, py, 2, 4);
    }
  } else if (t === T.SNOW) {
    c.fillStyle = info.d;
    c.fillRect(px, py + SZ * 0.5, SZ, SZ * 0.5);
    c.fillStyle = '#fff';
    for (let i = 0; i < 3; i++) {
      c.fillRect(px + h1(i * 11 + t) * (SZ - 4), py + h2(i * 13 + t) * (SZ * 0.4), 2, 2);
    }
  } else if (t === T.STONE || t === T.DUNGEON_BRICK) {
  // 石头：灰底 + 大块深灰斑 + 裂纹
  c.fillStyle = '#5a5a5a';
  for (let i = 0; i < 4; i++) {
    const bx = px + h1(i * 7 + t) * (SZ - 8);
    const by = py + h2(i * 7 + t) * (SZ - 8);
    c.fillRect(bx, by, 6, 5);
  }
  c.strokeStyle = 'rgba(0,0,0,.4)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(px + 4, py + 6);
  c.lineTo(px + 10, py + 14);
  c.lineTo(px + 8, py + 20);
  c.stroke();
} else if (t === T.SANDSTONE) {
  // 砂岩：横条纹
  c.fillStyle = '#c0b080';
  c.fillRect(px, py + 6, SZ, 1);
  c.fillRect(px, py + 13, SZ, 1);
  c.fillRect(px, py + 20, SZ, 1);
} else if (t === T.BRICK) {
  // 砖：交错格子
  c.fillStyle = '#704030';
  c.fillRect(px, py + 8, SZ, 1);
  c.fillRect(px, py + 17, SZ, 1);
  c.fillRect(px + 8, py, 1, 8);
  c.fillRect(px + 16, py + 8, 1, 9);
  c.fillRect(px + 8, py + 17, 1, 9);
} else if (t === T.DIRT) {
  // 泥土：不规则深棕色斑块
  c.fillStyle = '#4a2a0a';
  for (let i = 0; i < 5; i++) {
    const bx = px + h1(i * 3 + t) * (SZ - 5);
    const by = py + h2(i * 5 + t) * (SZ - 5);
    c.fillRect(bx, by, 4, 3);
  }
  c.fillStyle = '#a08060';
  for (let i = 0; i < 3; i++) {
    const bx = px + h1(i * 11 + t) * (SZ - 3);
    const by = py + h2(i * 13 + t) * (SZ - 3);
    c.fillRect(bx, by, 2, 2);
  }
} else if (t === T.SAND) {
  // 沙子：细密点状
  c.fillStyle = '#b8a870';
  for (let i = 0; i < 8; i++) {
    const bx = px + h1(i * 3 + t) * (SZ - 2);
    const by = py + h2(i * 5 + t) * (SZ - 2);
    c.fillRect(bx, by, 1, 1);
  }
  c.fillStyle = '#f0e0a8';
  for (let i = 0; i < 4; i++) {
    const bx = px + h1(i * 17 + t) * (SZ - 2);
    const by = py + h2(i * 19 + t) * (SZ - 2);
    c.fillRect(bx, by, 1, 1);
  }
} else if (t === T.PAPER_SOIL) {
  // 纸田土壤：深棕 + 纸屑
  c.fillStyle = '#3a2a10';
  for (let i = 0; i < 4; i++) {
    c.fillRect(px + h1(i + t) * (SZ - 4), py + h2(i + t) * (SZ - 4), 3, 2);
  }
  c.fillStyle = '#f8f0d0';
  c.fillRect(px + 6, py + 8, 3, 2);
  c.fillRect(px + 16, py + 16, 2, 2);

  } else if (t === T.WOOD || t === T.HOUSE_BLOCK) {
    c.fillStyle = info.d;
    c.fillRect(px + 3, py, 2, SZ);
    c.fillRect(px + SZ - 6, py, 2, SZ);
  } else if (t === T.LEAF) {
    c.fillStyle = 'rgba(0,0,0,.15)';
    for (let i = 0; i < 3; i++) {
      c.fillRect(px + h1(i * 11 + t) * (SZ - 4), py + h2(i * 13 + t) * (SZ - 4), 4, 4);
    }
  } else if (t === T.CACTUS) {
    c.fillStyle = info.d;
    c.fillRect(px + 3, py, 2, SZ);
    c.fillRect(px + SZ - 5, py, 2, SZ);
  } else if (t === T.WATER) {
    c.fillStyle = 'rgba(58,106,176,.7)';
    c.fillRect(px, py, SZ, SZ);
  } else if (t === T.LAVA) {
    c.fillStyle = '#ff5010';
    c.fillRect(px, py, SZ, SZ);
    c.fillStyle = '#ff8040';
    c.fillRect(px + 4, py + 4, SZ - 8, SZ - 8);
  } else if (t === T.COAL || t === T.IRON || t === T.GOLD || t === T.DIAMOND || t === T.REDSTONE || t === T.PAPER_ORE || t === T.LAPIS_ORE || t === T.OBSIDIAN) {
    c.fillStyle = '#7a7a7a';
    c.fillRect(px, py, SZ, SZ);
    c.fillStyle = '#5a5a5a';
    c.fillRect(px + 2, py + 2, 3, 3);
    c.fillStyle = info.c;
    const cxp = px + SZ / 2, cyp = py + SZ / 2;
    for (let i = 0; i < 5; i++) {
      const a = i * 1.3;
      const r = 3 + i * 1.2;
      c.beginPath();
      c.arc(cxp + Math.cos(a) * r, cyp + Math.sin(a) * r, 2.5, 0, Math.PI * 2);
      c.fill();
    }
    if (t === T.DIAMOND || t === T.PAPER_ORE || t === T.LAPIS_ORE) {
      c.fillStyle = '#fff';
      c.beginPath();
      c.arc(cxp, cyp, 3, 0, Math.PI * 2);
      c.fill();
    }
  } else if (t === T.BEDROCK) {
    c.fillStyle = '#1a1a1a';
    c.fillRect(px, py, SZ, SZ);
    c.fillStyle = '#000';
    for (let i = 0; i < 6; i++) {
      c.fillRect(px + h1(i + t) * (SZ - 4), py + h2(i + t) * (SZ - 4), 4, 4);
    }
  } else if (t === T.GLASS) {
    c.fillStyle = 'rgba(200,232,248,.35)';
    c.fillRect(px, py, SZ, SZ);
    c.strokeStyle = 'rgba(160,200,230,.7)';
    c.lineWidth = 1;
    c.strokeRect(px + 0.5, py + 0.5, SZ - 1, SZ - 1);
  } else if (t === T.FLOWER) {
    c.fillStyle = '#3a803a';
    c.fillRect(px + SZ / 2 - 1, py + SZ * 0.5, 2, SZ * 0.5);
    c.fillStyle = info.c;
    for (let i = 0; i < 5; i++) {
      const a = i * 1.256;
      c.beginPath();
      c.arc(px + SZ / 2 + Math.cos(a) * 4, py + SZ * 0.4 + Math.sin(a) * 4, 3, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = '#ffe080';
    c.beginPath();
    c.arc(px + SZ / 2, py + SZ * 0.4, 2, 0, Math.PI * 2);
    c.fill();
  } else if (t === T.TORCH) {
    c.fillStyle = '#5a3a1a';
    c.fillRect(px + SZ / 2 - 1, py + SZ * 0.3, 3, SZ * 0.7);
    c.fillStyle = '#f0a030';
    c.beginPath();
    c.arc(px + SZ / 2, py + SZ * 0.25, 4, 0, Math.PI * 2);
    c.fill();
  } else if (t === T.CHEST || t === T.DUNGEON_CHEST) {
    c.fillStyle = info.c;
    c.fillRect(px + 2, py + SZ * 0.35, SZ - 4, SZ * 0.65);
    c.fillStyle = info.d;
    c.fillRect(px + 2, py + SZ * 0.35, SZ - 4, 3);
    c.fillStyle = '#ffd700';
    c.fillRect(px + SZ / 2 - 2, py + SZ * 0.6, 4, 4);
  } else if (t === T.ANCIENT) {
    c.fillStyle = info.c;
    c.fillRect(px + 3, py + 2, SZ - 6, SZ - 4);
    c.fillStyle = '#8888aa';
    for (let i = 0; i < 4; i++) {
      c.fillRect(px + 5 + i * 4, py + 6, 2, SZ - 12);
    }
  } else if (t === T.CRAFT_TABLE) {
    c.fillStyle = info.d;
    c.fillRect(px, py + SZ * 0.7, SZ, SZ * 0.3);
    c.fillStyle = '#8a5a3a';
    c.fillRect(px + 2, py + 2, SZ - 4, 4);
  } else if (t === T.FURNACE) {
    c.fillStyle = '#2a2a2a';
    c.fillRect(px + 4, py + SZ * 0.5, SZ - 8, SZ * 0.4);
    c.fillStyle = '#ff6020';
    c.beginPath();
    c.arc(px + SZ / 2, py + SZ * 0.7, 3, 0, Math.PI * 2);
    c.fill();
  } else if (t === T.ENCHANT_TABLE) {
    c.fillStyle = '#a060ff';
    c.beginPath();
    c.arc(px + SZ / 2, py + SZ / 2, 6, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(px + SZ / 2, py + SZ / 2, 3, 0, Math.PI * 2);
    c.fill();
  } else if (t === T.PORTAL_FRAME) {
    c.fillStyle = '#8030ff';
    c.fillRect(px + 2, py + 2, SZ - 4, SZ - 4);
    c.strokeStyle = '#c060ff';
    c.lineWidth = 2;
    c.strokeRect(px + 2, py + 2, SZ - 4, SZ - 4);
  } else if (t === T.PORTAL_CORE) {
    c.fillStyle = '#ff30ff';
    c.beginPath();
    c.arc(px + SZ / 2, py + SZ / 2, 7, 0, Math.PI * 2);
    c.fill();
  } else if (t === T.RAIL) {
    c.fillStyle = '#8a8a8a';
    c.fillRect(px, py + SZ * 0.4, SZ, 3);
    c.fillStyle = '#5a5a5a';
    for (let i = 0; i < 3; i++) {
      c.fillRect(px + 4 + i * 8, py + SZ * 0.3, 2, 6);
    }
  } else if (t === T.REDSTONE_TABLE) {
    c.fillStyle = '#ff3030';
    for (let i = 0; i < 4; i++) {
      c.fillRect(px + 4 + i * 5, py + SZ * 0.5, 2, 4);
    }
  } else if (t === T.VOID_MINER) {
    c.fillStyle = '#a080ff';
    c.beginPath();
    c.arc(px + SZ / 2, py + SZ / 2, 5, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(px + SZ / 2, py + SZ / 2, 2, 0, Math.PI * 2);
    c.fill();
  } else if (t === T.CULTIVATOR) {
    c.fillStyle = '#60ffa0';
    for (let i = 0; i < 3; i++) {
      c.fillRect(px + 4 + i * 6, py + 4, 3, SZ - 8);
    }
  } else if (t === T.CONTROLLER) {
    c.fillStyle = '#ffd700';
    c.fillRect(px + 4, py + 4, SZ - 8, 2);
    c.fillRect(px + 4, py + SZ - 6, SZ - 8, 2);
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(px + SZ / 2, py + SZ / 2, 3, 0, Math.PI * 2);
    c.fill();
  } else if (t === T.ALCHEMY) {
    c.fillStyle = '#ff60c0';
    c.beginPath();
    c.arc(px + SZ / 2, py + SZ * 0.6, 5, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#5a1a4a';
    c.fillRect(px + SZ / 2 - 2, py + SZ * 0.2, 4, SZ * 0.4);
  }

  c.strokeStyle = 'rgba(0,0,0,.12)';
  c.lineWidth = 1;
  c.strokeRect(px + 0.5, py + 0.5, SZ - 1, SZ - 1);
}

function drawBlock(x, y, t) {
  const px = x * BS - camera.x;
  const py = y * BS - camera.y;
  const info = INFO[t];
  if (!info) return;

  if (BLOCK_CACHE[t] && t !== T.TORCH && t !== T.WATER && t !== T.LAVA
      && t !== T.CHEST && t !== T.DUNGEON_CHEST && t !== T.ANCIENT) {
    ctx.drawImage(BLOCK_CACHE[t], px, py);
  } else {
    ctx.fillStyle = info.c;
    ctx.fillRect(px, py, BS, BS);

    if (t === T.WATER) {
      ctx.fillStyle = 'rgba(58,106,176,.7)';
      ctx.fillRect(px, py, BS, BS);
      const wave = Math.sin(performance.now() / 400 + x) * 2;
      ctx.fillStyle = 'rgba(120,170,230,.5)';
      ctx.fillRect(px, py + wave, BS, 3);
    } else if (t === T.LAVA) {
      const wave = Math.sin(performance.now() / 300 + x) * 2;
      ctx.fillStyle = '#ff5010';
      ctx.fillRect(px, py, BS, BS);
      ctx.fillStyle = '#ff8040';
      ctx.fillRect(px + wave, py + 4, BS - 4, BS - 8);
    } else if (t === T.TORCH) {
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(px + BS / 2 - 1, py + BS * 0.3, 3, BS * 0.7);
      const flick = Math.sin(performance.now() / 100) * 1;
      ctx.shadowColor = '#ffc060';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#f0a030';
      ctx.beginPath();
      ctx.arc(px + BS / 2, py + BS * 0.25 + flick, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffea80';
      ctx.beginPath();
      ctx.arc(px + BS / 2, py + BS * 0.25 + flick, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else if (t === T.CHEST || t === T.DUNGEON_CHEST) {
      ctx.fillStyle = info.c;
      ctx.fillRect(px + 2, py + BS * 0.35, BS - 4, BS * 0.65);
      ctx.fillStyle = info.d;
      ctx.fillRect(px + 2, py + BS * 0.35, BS - 4, 3);
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(px + BS / 2 - 2, py + BS * 0.6, 4, 4);
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 8;
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 2.5, py + BS * 0.35 + .5, BS - 5, BS * 0.65 - 1);
      ctx.shadowBlur = 0;
    } else if (t === T.ANCIENT) {
      ctx.fillStyle = info.c;
      ctx.fillRect(px + 3, py + 2, BS - 6, BS - 4);
      ctx.fillStyle = '#8888aa';
      for (let i = 0; i < 4; i++) {
        ctx.fillRect(px + 5 + i * 4, py + 6, 2, BS - 12);
      }
      ctx.shadowColor = info.glow;
      ctx.shadowBlur = 12;
      ctx.strokeStyle = info.glow;
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 3.5, py + 2.5, BS - 7, BS - 5);
      ctx.shadowBlur = 0;
    } else if (info.glow) {
      ctx.shadowColor = info.glow;
      ctx.shadowBlur = 8;
      ctx.fillStyle = info.c;
      ctx.fillRect(px + 2, py + 2, BS - 4, BS - 4);
      ctx.shadowBlur = 0;
    }
    ctx.strokeStyle = 'rgba(0,0,0,.12)';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, BS - 1, BS - 1);
  }

  if (S) {
    const pcx2 = (S.player.x + S.player.w / 2) / BS;
    const pcy2 = (S.player.y + S.player.h / 2) / BS;
    const dist = Math.hypot(x - pcx2, y - pcy2);
    if (dist > 10 && !(S.buffs.night > Date.now())) {
      const dark = Math.min(0.8, (dist - 10) * 0.08);
      ctx.fillStyle = `rgba(0,0,0,${dark})`;
      ctx.fillRect(px, py, BS, BS);
    }
  }
}

function drawPlayer() {
  const p = S.player;
  const px = p.x - camera.x;
  const py = p.y - camera.y;
  if (p.hurtFlash > 0 && Math.floor(performance.now() / 80) % 2) return;

  if (S.buffs.invis > Date.now()) {
    ctx.globalAlpha = 0.3;
  }

  ctx.fillStyle = '#3a6a9a';
  ctx.fillRect(px, py + p.h * 0.4, p.w, p.h * 0.6);
  ctx.fillStyle = '#e8c8a8';
  ctx.fillRect(px, py, p.w, p.h * 0.4);
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(px, py, p.w, p.h * 0.12);
  ctx.fillStyle = '#111';
  const eyeY = py + p.h * 0.18;
  const ex = p.facing > 0 ? p.w * 0.6 : p.w * 0.1;
  ctx.fillRect(px + ex, eyeY, 2.5, 2.5);

  // 装备可视化
  if (S.equip) {
    if (S.equip.helm) {
      ctx.fillStyle = INFO[S.equip.helm] ? INFO[S.equip.helm].c : '#a07040';
      ctx.fillRect(px - 2, py - 2, p.w + 4, p.h * 0.2);
    }
    if (S.equip.chest) {
      ctx.fillStyle = INFO[S.equip.chest] ? INFO[S.equip.chest].c : '#a07040';
      ctx.fillRect(px - 1, py + p.h * 0.38, p.w + 2, p.h * 0.35);
    }
  }

  ctx.globalAlpha = 1;
}

function drawMonster(px, py, w, h, m) {
  if (m.hurtFlash > 0 && Math.floor(performance.now() / 60) % 2) return;
  const def = m.def;
  if (!def) return;

  ctx.fillStyle = def.c;
  ctx.fillRect(px, py + h * 0.35, w, h * 0.65);
  ctx.fillStyle = def.c;
  ctx.fillRect(px, py, w, h * 0.35);
  ctx.fillStyle = '#e83030';
  ctx.fillRect(px + w * 0.15, py + h * 0.15, 2.5, 2.5);
  ctx.fillRect(px + w * 0.6, py + h * 0.15, 2.5, 2.5);
  if (m.hp < m.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(px, py - 6, w, 4);
    ctx.fillStyle = '#e83030';
    ctx.fillRect(px, py - 6, w * (m.hp / m.maxHp), 4);
  }
}

function drawBoss(px, py, w, h, b) {
  if (b.hurtFlash > 0 && Math.floor(performance.now() / 50) % 2) return;
  ctx.fillStyle = '#3a0a0a';
  ctx.fillRect(px, py + h * 0.35, w, h * 0.65);
  ctx.fillStyle = '#8a1010';
  ctx.fillRect(px, py, w, h * 0.35);
  ctx.fillStyle = '#ffcc00';
  ctx.fillRect(px + w * 0.15, py + h * 0.14, 4, 4);
  ctx.fillRect(px + w * 0.65, py + h * 0.14, 4, 4);
  ctx.fillStyle = '#fff';
  ctx.fillRect(px + w * 0.25, py + h * 0.25, 3, 6);
  ctx.fillRect(px + w * 0.7, py + h * 0.25, 3, 6);
  if (b.hp < b.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(px - 4, py - 12, w + 8, 7);
    ctx.fillStyle = '#ff3030';
    ctx.fillRect(px - 4, py - 12, (w + 8) * (b.hp / b.maxHp), 7);
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.fillText(b.def.n, px, py - 16);
  }
}

const GRAVITY = 2000;
const MOVE_SPEED = 170;
const JUMP_VEL = -620;

function updatePlayer(dt) {
  const p = S.player;

  let ax = 0;
  if (keys.left) ax -= 1;
  if (keys.right) ax += 1;
  if (ax !== 0) {
    p.facing = ax;
    S.stat.walkDist = (S.stat.walkDist || 0) + dt * MOVE_SPEED / BS;
  }

  let spdBuff = 1;
  if (S.buffSpdUntil > Date.now()) spdBuff *= 2;
  if (S.buffs.speed > Date.now()) spdBuff *= 1.5;
  if (S.pet === 'dog') spdBuff *= 1.05;
  if (S.weather === 'sand') spdBuff *= 0.7;
  // 附魔迅捷
  for (const slot in S.equip) {
    const it = S.equip[slot];
    if (it && S.enchant[it] && S.enchant[it].swift) {
      spdBuff *= 1 + S.enchant[it].swift * 0.05;
    }
  }

  const baseSpeed = MOVE_SPEED * (1 + (S.soulLv.origin_speed || 0) * 0.12 + ((S.stLv && S.stLv.permSpeed) || 0) * 0.08);
  p.vx = ax * baseSpeed * spdBuff;

  const nx = p.x + p.vx * dt;
  if (!collidesPlayer(nx, p.y)) {
    p.x = nx;
  } else {
    const step = p.vx > 0 ? 1 : -1;
    let test = p.x;
    const maxStep = Math.abs(p.vx * dt);
    for (let i = 0; i < maxStep; i++) {
      if (!collidesPlayer(test + step, p.y)) test += step;
      else break;
    }
    p.x = test;
  }

  // 飞行（飞天扫帚 / 火箭靴预留）
  let canFly = false;
  if (S.vehicle === 'broom' && keys.jump) canFly = true;

  if (!canFly) {
    p.vy += GRAVITY * dt;
    if (p.vy > 1400) p.vy = 1400;
  } else {
    p.vy = -220;
  }

  const ny = p.y + p.vy * dt;
  if (!collidesPlayer(p.x, ny)) {
    p.y = ny;
    p.onGround = false;
  } else {
    if (p.vy > 0) {
      p.onGround = true;
      let steps = 0;
      while (!collidesPlayer(p.x, p.y + 1) && steps < 30) { p.y += 1; steps++; }
    } else {
      let steps = 0;
      while (collidesPlayer(p.x, p.y) && steps < 30) { p.y += 1; steps++; }
    }
    p.vy = 0;
  }

  if (keys.jump && p.onGround && !canFly) {
    p.vy = JUMP_VEL;
    p.onGround = false;
  }

  if (p.y > H * BS) {
    p.y = 0;
    damagePlayer(3);
  }

  if (p.invuln > 0) p.invuln -= dt;
  if (p.hurtFlash > 0) p.hurtFlash -= dt;

  const light = dayLight();
  if (light > 0.7 && p.hp < p.maxHp) {
    p.healT = (p.healT || 0) + dt;
    if (p.healT > 4) {
      p.healT = 0;
      p.hp = Math.min(p.maxHp, p.hp + 1);
      updateHUD();
    }
  } else {
    p.healT = 0;
  }

  // 药水持续回血
  if (S.buffs.regen > Date.now()) {
    p.regenT = (p.regenT || 0) + dt;
    if (p.regenT > 2) {
      p.regenT = 0;
      p.hp = Math.min(p.maxHp, p.hp + 1);
      updateHUD();
    }
  }
}

function collidesPlayer(px, py) {
  const p = S.player;
  const x1 = Math.floor(px / BS);
  const y1 = Math.floor(py / BS);
  const x2 = Math.floor((px + p.w - 1) / BS);
  const y2 = Math.floor((py + p.h - 1) / BS);
  for (let y = y1; y <= y2; y++) {
    for (let x = x1; x <= x2; x++) {
      if (isSolid(x, y)) return true;
    }
  }
  return false;
}

function collidesBox(px, py, w, h) {
  const x1 = Math.floor(px / BS);
  const y1 = Math.floor(py / BS);
  const x2 = Math.floor((px + w - 1) / BS);
  const y2 = Math.floor((py + h - 1) / BS);
  for (let y = y1; y <= y2; y++) {
    for (let x = x1; x <= x2; x++) {
      if (isSolid(x, y)) return true;
    }
  }
  return false;
}

function damagePlayer(n) {
  const p = S.player;
  if (p.invuln > 0) return;
  // 减伤（装备 + 附魔 + 药水）
  let reduce = 0;
  if (S.buffs.iron > Date.now()) reduce += 0.5;
  if (S.equip) {
    for (const slot in S.equip) {
      const it = S.equip[slot];
      if (!it) continue;
      if (S.enchant[it] && S.enchant[it].protect) {
        reduce += S.enchant[it].protect * 0.05;
      }
      const info = INFO[it];
      if (info && info.eq === 'chest' && info.q) reduce += info.q * 0.05;
      if (info && info.eq === 'leg' && info.q) reduce += info.q * 0.03;
      if (info && info.eq === 'helm' && info.q) reduce += info.q * 0.03;
    }
  }
  if (reduce > 0.85) reduce = 0.85;
  const finalDmg = Math.max(1, Math.ceil(n * (1 - reduce)));
  p.hp -= finalDmg;
  p.invuln = 0.8;
  p.hurtFlash = 0.3;

  // 荆棘反伤
  if (S.equip && S.equip.chest && S.enchant[S.equip.chest] && S.enchant[S.equip.chest].thorn) {
    // 触发的反伤交给攻击源处理
  }

  updateHUD();
  if (p.hp <= 0) die();
}

function die() {
  toast('💀 你死了');
  setTimeout(() => { doDeathRebirth(); }, 1200);
}

const keys = { left: false, right: false, jump: false, attack: false };

function bindButton(id, key) {
  const el = document.getElementById(id);
  if (!el) return;
  const on = (e) => { e.preventDefault(); keys[key] = true; };
  const off = (e) => { e.preventDefault(); keys[key] = false; };
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
  if (e.key === 'w' || e.key === 'ArrowUp' || e.key === ' ') {
    e.preventDefault();
    keys.jump = true;
  }
  if (e.key === 'j' || e.key === 'k') keys.attack = true;
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
  if (e.key === 'w' || e.key === 'ArrowUp' || e.key === ' ') keys.jump = false;
  if (e.key === 'j' || e.key === 'k') keys.attack = false;
});

const MODES = ['mine', 'place', 'build', 'sow'];
const MODE_LABEL = { mine:'⛏ 挖掘', place:'🧱 放置', build:'🏗 建造', sow:'🌾 播种' };
const MODE_CLS = { mine:'', place:'place', build:'build', sow:'sow' };

function setupModeButton() {
  if (!S) return;
  const modeEl = document.getElementById('mode');
  if (!modeEl) return;
  const update = () => {
    modeEl.textContent = MODE_LABEL[S.mode];
    modeEl.className = MODE_CLS[S.mode];
  };
  modeEl.onclick = () => {
    const i = MODES.indexOf(S.mode);
    S.mode = MODES[(i + 1) % MODES.length];
    update();
    toast(MODE_LABEL[S.mode]);
  };
  update();
}

let pointerDown = false;
let pointerX = 0, pointerY = 0;

function screenToWorld(cx, cy) {
  const rect = cv.getBoundingClientRect();
  return { x: camera.x + (cx - rect.left), y: camera.y + (cy - rect.top) };
}
function pointerCell(cx, cy) {
  const w = screenToWorld(cx, cy);
  return { bx: Math.floor(w.x / BS), by: Math.floor(w.y / BS) };
}
function inReach(bx, by) {
  const p = S.player;
  const pcx = (p.x + p.w / 2) / BS;
  const pcy = (p.y + p.h / 2) / BS;
  return Math.hypot(bx - pcx, by - pcy) <= 8;
}

function setupPointerEvents() {
  cv.addEventListener('mousedown', (e) => startPointer(e.clientX, e.clientY));
  cv.addEventListener('mouseup', endPointer);
  cv.addEventListener('mouseleave', endPointer);
  cv.addEventListener('mousemove', (e) => { pointerX = e.clientX; pointerY = e.clientY; });

  cv.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    startPointer(t.clientX, t.clientY);
  }, { passive: false });
  cv.addEventListener('touchend', (e) => { e.preventDefault(); endPointer(); }, { passive: false });
  cv.addEventListener('touchcancel', (e) => { e.preventDefault(); endPointer(); }, { passive: false });
  cv.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    pointerX = t.clientX;
    pointerY = t.clientY;
  }, { passive: false });
}

function startPointer(cx, cy) {
  pointerDown = true;
  pointerX = cx; pointerY = cy;
  tryAction(cx, cy);
}
function endPointer() {
  pointerDown = false;
  mineProgress = 0;
  mineTarget = null;
}

let mineProgress = 0;
let mineTarget = null;

function tryAction(cx, cy) {
  const p = pointerCell(cx, cy);
  if (!inReach(p.bx, p.by)) {
    toast('太远');
    return;
  }
  if (S.mode === 'mine') tryMine(p.bx, p.by);
  else if (S.mode === 'place') tryPlace(p.bx, p.by, false);
  else if (S.mode === 'build') tryPlace(p.bx, p.by, true);
  else if (S.mode === 'sow') trySow(p.bx, p.by);
}
function tryMine(bx, by) {
  const t = getBlock(bx, by);
  if (t === T.AIR || t === T.BEDROCK || t === T.WATER || t === T.LAVA || t === T.PORTAL) return;
  if (!mineTarget || mineTarget.x !== bx || mineTarget.y !== by) {
    mineTarget = { x: bx, y: by, type: t };
    mineProgress = 0;
  }
}

function continueMine(dt) {
  if (!pointerDown || S.mode !== 'mine' || !mineTarget) return;
  if (!inReach(mineTarget.x, mineTarget.y)) { mineProgress = 0; return; }
  const hard = HARD[mineTarget.type] || 1;
  let toolMul = 1 + (S.soulLv.origin_mine || 0) * 0.15 + (S.plv.keepClick || 0) * 0.1;
  // 附魔效率
  const wep = S.equip && S.equip.weapon;
  if (wep && S.enchant[wep] && S.enchant[wep].eff) {
    toolMul *= 1 + S.enchant[wep].eff * 0.15;
  }
  mineProgress += dt * toolMul / hard;
  if (mineProgress >= 1) doMineBreak(mineTarget);
}

function trackMine(type) {
  S.stat.blocks++;
  if (type === T.IRON)    S.stat.ironOre++;
  if (type === T.DIAMOND) S.stat.diamond++;
  if (type === T.WOOD)    S.stat.woodPick = S.stat.woodPick || 0;
}

function chainMine(startX, startY, allowedTypes, maxCount) {
  const visited = {};
  const queue = [[startX, startY]];
  const result = [];
  while (queue.length > 0 && result.length < maxCount) {
    const [x, y] = queue.shift();
    const k = x + ',' + y;
    if (visited[k]) continue;
    visited[k] = true;
    const t = getBlock(x, y);
    if (allowedTypes.indexOf(t) === -1) continue;
    result.push({ x, y, type: t });
    queue.push([x + 1, y]);
    queue.push([x - 1, y]);
    queue.push([x, y + 1]);
    queue.push([x, y - 1]);
  }
  return result;
}

function isOreType(t) {
  return t === T.COAL || t === T.IRON || t === T.GOLD ||
         t === T.DIAMOND || t === T.REDSTONE || t === T.PAPER_ORE ||
         t === T.LAPIS_ORE || t === T.OBSIDIAN;
}

function doChainBreak(startX, startY) {
  const startType = getBlock(startX, startY);
  if (startType === T.AIR) return;

  let chain = null;

if (startType === T.WOOD || startType === T.HOUSE_BLOCK) {
  // 木头：只连锁同种木头（不砍树叶）
  chain = chainMine(startX, startY, [T.WOOD, T.HOUSE_BLOCK], 64);
} else if (isOreType(startType)) {
  // 矿石：连锁同种矿石
  chain = chainMine(startX, startY, [startType], 32);
} else {
  // 其他方块：只挖单块
  chain = [{ x: startX, y: startY, type: startType }];
}

  if (!chain || chain.length === 0) return;

  let totalQi = 0;
  for (const b of chain) {
    const t = b.type;
    const key = b.x + ',' + b.y;
    const wasPlaced = (S.changes[key] !== undefined);

    if (!wasPlaced) {
      if (t === T.ANCIENT) {
        const q = 100 + Math.floor(Math.random() * 300);
        S.qi += q; totalQi += q;
        setBlock(b.x, b.y, T.AIR);
        continue;
      }
      if (t === T.CHEST || t === T.DUNGEON_CHEST) {
        const g = Math.floor((200 + Math.random() * 800) * goldMul());
        S.gold += g; S.tg += g;
        // 宝箱有概率开出装备
        if (Math.random() < 0.15) {
          const equips = [T.EQ_HELM_IRON, T.EQ_CHEST_IRON, T.EQ_LEG_IRON,
                          T.EQ_NECK_HP, T.EQ_RING_ATK, T.EQ_RING_SPD, T.EQ_AMULET_CRIT];
          const eq = equips[Math.floor(Math.random() * equips.length)];
          addDrop(b.x, b.y, eq, 1);
          toast('📦 宝箱开出装备！');
        }
        setBlock(b.x, b.y, T.AIR);
        continue;
      }
      if (t === T.PAPER_ORE) {
        const n = Math.floor((1 + Math.floor(Math.random() * 3)) * luckMul());
        addDrop(b.x, b.y, T.PAPER_ORE, n);
        const paperAdd = n * 3;
        S.paper[0] = (S.paper[0] || 0) + paperAdd;
        S.tp += paperAdd;
        if (Math.random() < 0.5) S.paperSeed = (S.paperSeed || 0) + 1;
        setBlock(b.x, b.y, T.AIR);
        continue;
      }
      if (t === T.LAPIS_ORE) {
        addDrop(b.x, b.y, T.LAPIS, 1 + Math.floor(Math.random() * 2));
        setBlock(b.x, b.y, T.AIR);
        continue;
      }
    }

    if (t === T.LEAF) {
      addDrop(b.x, b.y, T.LEAF, 1);
      if (Math.random() < 0.15) addDrop(b.x, b.y, T.WOOD, 1);
    } else {
      const drop = DROP[t];
      if (drop) addDrop(b.x, b.y, drop, 1);
    }
    trackMine(t);
    setBlock(b.x, b.y, T.AIR);

    // 机器方块记录同步删除
    if (WORK_BLOCK_TYPES.indexOf(t) !== -1 && S.machines) {
      const kindMap = { 34:'miner', 35:'cultivator', 36:'controller' };
      const kind = kindMap[t];
      if (kind) {
        S.machines = S.machines.filter(m => !(m.x === b.x && m.y === b.y && m.kind === kind));
      }
    }
  }

  // 连锁掉落：矿石额外掉经验
  for (const b of chain) {
    if (isOreType(b.type)) {
      S.exp = (S.exp || 0) + 1;
    }
  }

  if (totalQi > 0) toast('📜 古碑 +' + totalQi + ' 修为');
  if (chain.length > 3) {
    toast('⛏ 连锁 x' + chain.length);
    S.stat.chainCount = (S.stat.chainCount || 0) + 1;
  }
  mineProgress = 0;
  mineTarget = null;
}

function doMineBreak(target) {
  const key = target.x + ',' + target.y;
  if (S.changes[key] !== undefined) {
    const drop = DROP[target.type];
    if (drop) addDrop(target.x, target.y, drop, 1);
    if (isOreType(target.type)) S.exp = (S.exp || 0) + 1;
    setBlock(target.x, target.y, T.AIR);
    // 机器同步删除
    if (WORK_BLOCK_TYPES.indexOf(target.type) !== -1 && S.machines) {
      const kindMap = { 34:'miner', 35:'cultivator', 36:'controller' };
      const kind = kindMap[target.type];
      if (kind) {
        S.machines = S.machines.filter(m => !(m.x === target.x && m.y === target.y && m.kind === kind));
      }
    }
    mineProgress = 0;
    mineTarget = null;
    return;
  }
  doChainBreak(target.x, target.y);
}

function tryPlace(bx, by, ignoreAdj) {
  const t = getBlock(bx, by);
  if (t !== T.AIR && t !== T.WATER) return;
  const sel = S.selected;
  if (!S.inventory[sel] || S.inventory[sel] <= 0) return;

  const p = S.player;
  const px1 = Math.floor(p.x / BS);
  const py1 = Math.floor(p.y / BS);
  const px2 = Math.floor((p.x + p.w - 1) / BS);
  const py2 = Math.floor((p.y + p.h - 1) / BS);
  if (bx >= px1 && bx <= px2 && by >= py1 && by <= py2) return;

  if (!ignoreAdj) {
    const has = isSolid(bx - 1, by) || isSolid(bx + 1, by)
             || isSolid(bx, by - 1) || isSolid(bx, by + 1)
             || getBlock(bx, by) === T.WATER;
    if (!has) return;
  }

  setBlock(bx, by, sel);
  S.inventory[sel]--;
  if (S.inventory[sel] <= 0) delete S.inventory[sel];

  // 传送门核心检测
  if (sel === T.PORTAL_CORE) checkPortalSpawn(bx, by);

  updateInvUI();
}

function trySow(bx, by) {
  const t = getBlock(bx, by);
  if (t !== T.GRASS && t !== T.DIRT && t !== T.PAPER_SOIL) return;
  const above = getBlock(bx, by - 1);
  if (above !== T.AIR && above !== T.FLOWER) return;

  if (!S.paperSeed || S.paperSeed <= 0) {
    toast('没有纸种子');
    return;
  }
  for (const f of S.fields) {
    if (f.x === bx && f.y === by - 1) return;
  }

  S.fields.push({ x: bx, y: by - 1, grow: 0, type: 0 });
  S.paperSeed--;
  setBlock(bx, by, T.PAPER_SOIL);
  if (above === T.FLOWER) setBlock(bx, by - 1, T.AIR);
  toast('🌾 种下纸种子');
}

function addDrop(wx, wy, type, count) {
  S.drops.push({
    x: wx * BS + BS * 0.15,
    y: wy * BS + BS * 0.15,
    vx: (Math.random() - 0.5) * 80,
    vy: -150,
    type: type,
    count: count || 1,
    life: 60
  });
}

function updateDrops(dt) {
  const p = S.player;
  for (let i = S.drops.length - 1; i >= 0; i--) {
    const d = S.drops[i];
    d.life -= dt;
    if (d.life <= 0) { S.drops.splice(i, 1); continue; }

    d.vy += GRAVITY * 0.5 * dt;
    if (d.vy > 600) d.vy = 600;
    d.x += d.vx * dt;
    d.y += d.vy * dt;

    const dropSize = BS * 0.65;
    const bx = Math.floor((d.x + dropSize / 2) / BS);
    const byBottom = Math.floor((d.y + dropSize) / BS);
    if (isSolid(bx, byBottom)) {
      d.y = byBottom * BS - dropSize;
      d.vy = 0;
      d.vx *= 0.7;
      let safety = 0;
      while (isSolid(bx, Math.floor(d.y / BS)) && safety < 6) {
        d.y -= BS;
        safety++;
      }
    }

    const dxp = p.x + p.w / 2 - d.x;
    const dyp = p.y + p.h / 2 - d.y;
    const dist = Math.hypot(dxp, dyp);
    if (dist < BS * 4) {
      d.x += dxp / dist * 500 * dt;
      d.y += dyp / dist * 500 * dt;
      if (dist < BS * 1.3) {
        // 装备类物品：优先装备到空槽，否则进背包
        const info = INFO[d.type];
        if (info && info.eq) {
          if (!S.equip[info.eq]) {
            S.equip[info.eq] = d.type;
            toast('🎽 装备 ' + info.n);
          } else {
            S.inventory[d.type] = (S.inventory[d.type] || 0) + d.count;
          }
        } else if (info && info.pet) {
          if (!S.petsOwned[info.pet]) {
            S.petsOwned[info.pet] = true;
            S.pet = info.pet;
            toast('🐾 获得宠物 ' + info.n);
          } else {
            S.inventory[d.type] = (S.inventory[d.type] || 0) + d.count;
          }
        } else if (info && info.vehicle) {
          S.vehicle = info.vehicle;
          toast('🚗 获得载具 ' + info.n);
        } else {
          S.inventory[d.type] = (S.inventory[d.type] || 0) + d.count;
        }
        S.drops.splice(i, 1);
        updateInvUI();
      }
    }
  }
}

function updateFields(dt) {
  const light = dayLight();
  if (light < 0.15) return;
  let growMul = light * (1 + (S.soulLv.origin_grass || 0) * 0.3);
  if (S.weather === 'rain' || S.weather === 'storm') growMul *= 2;
  for (const f of S.fields) {
    f.grow = (f.grow || 0) + dt * 0.12 * growMul;
    if (f.grow >= 1) {
      f.grow = 0;
      const paperType = f.type || 0;
      let yieldAmt = Math.floor((2 + Math.floor(Math.random() * 4)) * luckMul());
      if (S.pet === 'paper') yieldAmt = Math.floor(yieldAmt * 1.2);
      S.paper[paperType] = (S.paper[paperType] || 0) + yieldAmt;
      S.tp += yieldAmt;
      S.qi += 2;
      S.totalQi += 2;
      if (Math.random() < 0.3) S.paperSeed = (S.paperSeed || 0) + 1;
    }
  }
}

function paperPrice(k) {
  return 10 * (1 + parseInt(k) * 0.8);
}

function sellAllPaper() {
  let total = 0;
  for (const k in S.paper) {
    const n = S.paper[k];
    if (n > 0) total += n * paperPrice(k);
  }
  total = Math.floor(total * goldMul());
  if (total <= 0) { toast('没有纸'); return; }
  S.gold += total;
  S.tg += total;
  S.paper = {};
  toast('💰 +' + fmt(total) + ' 金币');
  updateHUD();
}

function updateCorn(dt) {
  const fieldLv = S.cornLv.field || 0;
  const mul = 1 + fieldLv * 0.1;
  const rate = (0.2 + fieldLv * 0.1) * mul;
  S.corn = (S.corn || 0) + rate * dt;

  const cap = 100000 + (S.cornLv.store || 0) * 10000;
  if (S.corn > cap) S.corn = cap;

  if (S.cornLv.auto > 0 && S.corn >= 1) {
    const n = Math.floor(S.corn * S.cornLv.auto);
    if (n > 0) {
      S.corn = Math.max(0, S.corn - n / S.cornLv.auto);
      const lucky = luckMul();
      const got = Math.floor(n * lucky);
      S.paper[0] = (S.paper[0] || 0) + got;
      S.tp += got;
    }
  }
}

function currentEra() {

function currentQuest() {

function eraQuestsDone(era) {

function checkQuests() {
  if (!S.questDone) S.questDone = {};
  let changed = false;

  for (const q of QUESTS) {
    if (S.questDone[q.id]) continue;
    if (q.era !== currentEra()) continue;
    if (q.done()) {
      S.questDone[q.id] = true;
      S.gold += q.rw.gold || 0;
      S.pts  += q.rw.pts  || 0;
      S.tg   += q.rw.gold || 0;
      toast('✅ 任务完成：' + q.n);
      log('任务完成：' + q.n);
      changed = true;
    }
  }

  if (eraQuestsDone(currentEra()) && currentEra() < ERAS.length - 1) {
    S.era = (S.era || 0) + 1;
    const era = ERAS[S.era];
    toast('🎉 进入 ' + era.n);
    log('时代晋升：' + era.n);
    showEraPopup(era);
  }

  if (changed) updateHUD();
}

function invCount(type) {
  return S.inventory[type] || 0;
}
function canCraft(recipe) {
  for (const k in recipe.need) {
    if (invCount(parseInt(k)) < recipe.need[k]) return false;
  }
  return true;
}
function doCraft(recipe) {
  if (!canCraft(recipe)) { toast('材料不足'); return; }
  for (const k in recipe.need) {
    S.inventory[k] -= recipe.need[k];
    if (S.inventory[k] <= 0) delete S.inventory[k];
  }
  S.inventory[recipe.out] = (S.inventory[recipe.out] || 0) + recipe.cnt;

  if (recipe.out === T.CRAFT_TABLE) S.stat.craftTable++;
  if (recipe.out === T.FURNACE)     S.stat.furnace++;
  if (recipe.out === T.STONE_PICK)  S.stat.stonePick++;
  if (recipe.out === T.WOOD_PICK)   S.stat.woodPick++;
  if (recipe.out === T.IRON_SWORD)  S.stat.ironSword++;
  if (recipe.out === T.DIAMOND_SWORD) S.stat.diamondSword++;
  if (recipe.out === T.REDSTONE_TABLE) S.stat.rtable++;
  if (recipe.out === T.VOID_MINER)  S.stat.vminer++;
  if (recipe.out === T.CULTIVATOR)  S.stat.cultivator++;
  if (recipe.out === T.CONTROLLER)  S.stat.controller++;
  if (recipe.out === T.ALCHEMY)     S.stat.alchemy++;

  const info = INFO[recipe.out];
  toast('🔨 ' + (info ? info.n : '物品') + ' x' + recipe.cnt);
  updateInvUI();
  openCraftingTable();
}

function openEnchantPicker(item) {
  const box = document.getElementById('popBox');
  const info = INFO[item];
  let html = '<h4>🔮 附魔 · ' + (info ? info.n : '?') + '</h4>';
  html += `<div style="font-size:11px;color:#9988bb;margin-bottom:8px">青金石 ${invCount(T.LAPIS)} · 经验 ${S.exp||0}</div>`;
  html += '<div style="max-height:60vh;overflow-y:auto">';

  const cur = S.enchant[item] || {};
  for (const ek in ENCHANTS) {
    const ed = ENCHANTS[ek];
    const lv = cur[ek] || 0;
    const maxed = lv >= ed.max;
    const lvCost = ed.cost(lv);
    const lapisCost = Math.max(1, Math.ceil(lvCost / 2));
    const expCost = lvCost * 5;
    const can = !maxed && invCount(T.LAPIS) >= lapisCost && (S.exp||0) >= expCost;
    html += `<div style="background:rgba(60,40,100,.5);border-radius:8px;padding:8px;margin:5px 0;text-align:left;font-size:12px">
      <b style="color:#c9a0ff">${ed.n} Lv.${lv}/${ed.max}</b>
      <div style="color:#90ee90;font-size:11px;margin:3px 0">${ed.desc(lv+1)}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
        <span style="color:#ffd97a;font-size:11px">💎${lapisCost} 经验${expCost}</span>
        <button data-ench-add="${ek}" ${can ? '' : 'disabled'} style="padding:5px 10px;font-size:11px;margin:0;width:auto">${maxed ? '满' : '升级'}</button>
      </div>
    </div>`;
  }

  html += '</div>';
  html += '<button id="enchBack" class="red" style="margin-top:8px">返 回</button>';
  box.innerHTML = html;
  document.getElementById('pop').classList.add('on');

  box.querySelectorAll('button[data-ench-add]').forEach(b => {
    b.onclick = () => doEnchant(item, b.dataset.enchAdd);
  });
  document.getElementById('enchBack').onclick = openEnchantTable;
}

function doEnchant(item, ek) {
  const ed = ENCHANTS[ek];
  const cur = S.enchant[item] || {};
  const lv = cur[ek] || 0;
  if (lv >= ed.max) { toast('满级'); return; }
  const lvCost = ed.cost(lv);
  const lapisCost = Math.max(1, Math.ceil(lvCost / 2));
  const expCost = lvCost * 5;
  if (invCount(T.LAPIS) < lapisCost) { toast('青金石不足'); return; }
  if ((S.exp||0) < expCost) { toast('经验不足'); return; }
  S.inventory[T.LAPIS] -= lapisCost;
  if (S.inventory[T.LAPIS] <= 0) delete S.inventory[T.LAPIS];
  S.exp -= expCost;
  if (!S.enchant[item]) S.enchant[item] = {};
  S.enchant[item][ek] = lv + 1;
  toast('🔮 ' + ed.n + ' Lv.' + (lv + 1));
  updateInvUI();
  openEnchantPicker(item);
}

function usePotion(type) {
  if (invCount(type) <= 0) { toast('没有药水'); return; }
  const info = INFO[type];
  if (!info || !info.potion) return;
  S.inventory[type]--;
  if (S.inventory[type] <= 0) delete S.inventory[type];
  const now = Date.now();
  if (info.potion === 'iron') {
    S.buffs.iron = now + 30000;
    toast('🛡 铁皮 30秒减伤50%');
  } else if (info.potion === 'speed') {
    S.buffs.speed = now + 60000;
    toast('💨 迅捷 60秒移速+50%');
  } else if (info.potion === 'night') {
    S.buffs.night = now + 60000;
    toast('🌙 夜视 60秒');
  } else if (info.potion === 'regen') {
    S.buffs.regen = now + 30000;
    toast('💚 再生 30秒');
  } else if (info.potion === 'str') {
    S.buffs.str = now + 30000;
    toast('⚔️ 力量 30秒伤害+80%');
  } else if (info.potion === 'invis') {
    S.buffs.invis = now + 15000;
    toast('👻 隐身 15秒');
  }
  updateHUD();
  updateInvUI();
}

// =====================
// 丹药使用
// =====================
function usePill(type) {
  if (invCount(type) <= 0) { toast('没有丹药'); return; }
  const info = INFO[type];
  S.inventory[type]--;
  if (S.inventory[type] <= 0) delete S.inventory[type];

  if (info.pill === 'hp') {
    S.player.hp = Math.min(S.player.maxHp, S.player.hp + 10);
    toast('❤️ 回血 +10');
  } else if (info.pill === 'atk') {
    S.buffPillAtkUntil = Date.now() + 30000;
    toast('⚔️ 力量丹 30秒 ×2');
  } else if (info.pill === 'qi') {
    S.qi += 500; S.totalQi += 500;
    toast('☯️ 修为 +500');
  } else if (info.pill === 'break') {
    if (S.qi < realmReq(S.realm) * 0.5) { toast('修为不足'); S.inventory[type]=(S.inventory[type]||0)+1; return; }
    S.qi += realmReq(S.realm) * 0.5;
    toast('⚡ 修为大增');
  } else if (info.pill === 'gold') {
    S.soul = (S.soul || 0) + 10;
    S.st = (S.st || 0) + 5;
    toast('✨ 九转金丹 +10本源 +5星尘');
  }
  updateHUD();
  updateInvUI();
}

const NPC_TYPES = {
  merchant: { n:'商人',     icon:'💰', color:'#c8a848', desc:'买卖物品' },
  smith:    { n:'铁匠',     icon:'🔨', color:'#909090', desc:'升级装备' },
  mage:     { n:'流浪法师', icon:'🔮', color:'#a060ff', desc:'诡纸附魔' }
};

function checkHouse() {
  if (!S) return;
  S.houseCheck = (S.houseCheck || 0) + 1;
  if (S.houseCheck < 600) return; // 每 10 秒检测一次
  S.houseCheck = 0;
  if (S.npcs.length >= 3) return;

  const p = S.player;
  const pcx = Math.floor((p.x + p.w / 2) / BS);
  const pcy = Math.floor((p.y + p.h / 2) / BS);

  // 在附近搜索 20x20 范围找房屋
  for (let ox = -10; ox <= 10; ox++) {
    for (let oy = -10; oy <= 10; oy++) {
      const cx = pcx + ox, cy = pcy + oy;
      if (cx < 3 || cx >= W - 3 || cy < 3 || cy >= H - 3) continue;
      if (isValidHouse(cx, cy)) {
        // 检查是否已经有 NPC 在这里
        let occupied = false;
        for (const n of S.npcs) {
          if (Math.abs(n.x - cx) < 5 && Math.abs(n.y - cy) < 5) { occupied = true; break; }
        }
        if (occupied) continue;
        spawnNpc(cx, cy);
        return;
      }
    }
  }
}

function isValidHouse(cx, cy) {
  // 检查 4x3 空间：底部地面 + 左右墙 + 顶 + 内部至少 1 光源
  let hasFloor = true;
  for (let dx = 0; dx < 4; dx++) {
    if (!isSolid(cx + dx, cy + 2)) { hasFloor = false; break; }
  }
  if (!hasFloor) return false;

  let hasWalls = true;
  for (let dy = 0; dy < 2; dy++) {
    if (!isSolid(cx, cy + dy) || !isSolid(cx + 3, cy + dy)) { hasWalls = false; break; }
  }
  if (!hasWalls) return false;

  let hasRoof = true;
  for (let dx = 0; dx < 4; dx++) {
    if (!isSolid(cx + dx, cy - 1)) { hasRoof = false; break; }
  }
  if (!hasRoof) return false;

  let hasLight = false;
  for (let dy = 0; dy < 2; dy++) {
    for (let dx = 1; dx < 3; dx++) {
      const t = getBlock(cx + dx, cy + dy);
      if (t === T.TORCH) { hasLight = true; }
    }
  }
  if (!hasLight) return false;

  // 内部必须空
  for (let dy = 0; dy < 2; dy++) {
    for (let dx = 1; dx < 3; dx++) {
      const t = getBlock(cx + dx, cy + dy);
      if (isSolid(cx + dx, cy + dy)) return false;
    }
  }
  return true;
}

function spawnNpc(cx, cy) {
  const keys = Object.keys(NPC_TYPES);
  const existing = S.npcs.map(n => n.kind);
  const available = keys.filter(k => !existing.includes(k));
  if (available.length === 0) return;
  const kind = available[Math.floor(Math.random() * available.length)];
  const def = NPC_TYPES[kind];
  S.npcs.push({
    kind: kind,
    x: cx + 1,
    y: cy + 1,
    icon: def.icon,
    color: def.color,
    name: def.n
  });
  toast('🏠 ' + def.n + ' 入驻了！');
  log('NPC：' + def.n + ' 定居在 ' + cx + ',' + cy);
}

function openNpcDialog(npc) {
  const box = document.getElementById('popBox');
  let html = '<h4>' + npc.icon + ' ' + npc.name + '</h4>';

  if (npc.kind === 'merchant') {
    html += '<div class="d">"要来点好东西吗？"</div>';
    html += '<button class="gold" data-shop="buy">💰 买（种子/方块/药水）</button>';
    html += '<button data-shop="sell">💸 卖（纸/矿石/装备）</button>';
  } else if (npc.kind === 'smith') {
    html += '<div class="d">"装备升级需要金币 + 材料"</div>';
    html += '<button class="gold" data-shop="upgrade">⚒ 升级装备</button>';
  } else if (npc.kind === 'mage') {
    html += '<div class="d">"用诡纸换附魔书"</div>';
    html += '<button class="gold" data-shop="book">🔮 买附魔书（诡纸 x5）</button>';
    html += '<button data-shop="identify">✨ 鉴定装备（诡纸 x2）</button>';
  }

  html += '<button class="red" id="npcClose" style="margin-top:8px">告 辞</button>';
  box.innerHTML = html;
  document.getElementById('pop').classList.add('on');

  box.querySelectorAll('button[data-shop]').forEach(b => {
    b.onclick = () => {
      const act = b.dataset.shop;
      if (act === 'buy')    openMerchantBuy(npc);
      else if (act === 'sell')   openMerchantSell(npc);
      else if (act === 'upgrade') openSmithUpgrade(npc);
      else if (act === 'book')    buyEnchantBook(npc);
      else if (act === 'identify') identifyEquip(npc);
    };
  });
  document.getElementById('npcClose').onclick = () => {
    document.getElementById('pop').classList.remove('on');
  };
}

  html += '<div style="max-height:60vh;overflow-y:auto">';
  for (const it of items) {
    const info = INFO[it.t];
    const can = S.gold >= it.cost;
    html += `<div style="background:rgba(60,50,20,.5);border-radius:8px;padding:8px;margin:5px 0;text-align:left;font-size:12px">

  document.getElementById('pop').classList.add('on');

function openMerchantSell(npc) {

                               invCount(T.GOLD) * 60 + invCount(T.DIAMOND) * 200 +
                               invCount(T.REDSTONE) * 15) * goldMul());

  html += `<button id="sellOre">卖矿石（+${fmt(oreValue)}）</button>`;
  html += '<button id="msBack" class="red">返 回</button>';
  box.innerHTML = html;
  document.getElementById('pop').classList.add('on');

  document.getElementById('sellPaper').onclick = () => {
    sellAllPaper();
    openMerchantSell(npc);
  };
  document.getElementById('sellOre').onclick = () => {
    if (oreValue <= 0) { toast('没有矿石'); return; }
    for (const t of [T.COAL, T.IRON, T.GOLD, T.DIAMOND, T.REDSTONE]) {
      delete S.inventory[t];
    }
    S.gold += oreValue; S.tg += oreValue;
    toast('💰 +' + fmt(oreValue) + ' 金币');

function openSmithUpgrade(npc) {
  const box = document.getElementById('popBox');
  let html = '<h4>⚒ 铁匠 · 升级装备</h4>';
  html += `<div style="font-size:11px;color:#9988bb;margin-bottom:8px">金币 ${fmt(S.gold)}</div>`;
  html += '<div class="d">每件装备可升级 3 次，+1 攻击 / +1 防御 / +5 血</div>';

  let found = false;
  for (const k in S.equip) {
    const it = S.equip[k];
    if (!it) continue;
    found = true;
    const lv = S.enchant[it] && S.enchant[it]._upgrade ? S.enchant[it]._upgrade : 0;
    const maxed = lv >= 3;
    const cost = 1000 * (lv + 1);
    const can = !maxed && S.gold >= cost;
    const info = INFO[it];
    html += `<div style="background:rgba(60,40,100,.5);border-radius:8px;padding:8px;margin:5px 0;text-align:left;font-size:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <b style="color:#c9a0ff">${info ? info.n : '?'}</b>
          <div style="color:#90ee90;font-size:11px">强化 +${lv}</div>
        </div>
        <button data-smith="${it}" ${can ? '' : 'disabled'} style="padding:5px 12px;font-size:11px;margin:0;width:auto">${maxed ? '满' : '💰'+cost}</button>
      </div>
    </div>`;
  }
  if (!found) html += '<div style="color:#888;padding:10px">没穿装备</div>';

  html += '<button id="smithBack" class="red" style="margin-top:8px">返 回</button>';
  box.innerHTML = html;
  document.getElementById('pop').classList.add('on');

  box.querySelectorAll('button[data-smith]').forEach(b => {
    b.onclick = () => {
      const it = parseInt(b.dataset.smith);
      if (!S.enchant[it]) S.enchant[it] = {};
      const lv = S.enchant[it]._upgrade || 0;
      const cost = 1000 * (lv + 1);
      if (S.gold < cost) { toast('金币不足'); return; }
      S.gold -= cost;
      S.enchant[it]._upgrade = lv + 1;
      toast('⚒ 强化 +' + (lv + 1));
      updateHUD();
      openSmithUpgrade(npc);
    };

function buyEnchantBook(npc) {
  if (S.gPaper < 5) { toast('诡纸不足（需要 5）'); return; }
  S.gPaper -= 5;
  S.inventory[T.BOOK_ENCHANT] = (S.inventory[T.BOOK_ENCHANT] || 0) + 1;
  toast('📖 获得附魔书');
  updateInvUI(); updateHUD();
}

function identifyEquip(npc) {
  if (S.gPaper < 2) { toast('诡纸不足（需要 2）'); return; }
  // 找到背包里第一件装备
  let found = null;
  for (const k in S.inventory) {
    const t = parseInt(k);
    const info = INFO[t];
    if (info && info.eq && S.inventory[k] > 0) { found = t; break; }
  }
  if (!found) { toast('没有可鉴定的装备'); return; }
  S.gPaper -= 2;
  // 随机给装备加一条附魔
  const keys = Object.keys(ENCHANTS);
  const ek = keys[Math.floor(Math.random() * keys.length)];
  if (!S.enchant[found]) S.enchant[found] = {};
  const ed = ENCHANTS[ek];
  const lv = S.enchant[found][ek] || 0;
  if (lv < ed.max) S.enchant[found][ek] = lv + 1;
  toast('✨ ' + (INFO[found] ? INFO[found].n : '?') + ' 附魔 ' + ed.n);
  updateHUD();
}

function openNearestStation() {
  if (!S) return;
  const p = S.player;
  const pcx = (p.x + p.w / 2) / BS;
  const pcy = (p.y + p.h / 2) / BS;

  // 优先检查 NPC
  for (const npc of S.npcs) {
    if (Math.abs(npc.x - pcx) < 3 && Math.abs(npc.y - pcy) < 3) {
      openNpcDialog(npc);
      return;
    }
  }

  let best = null, bestD = Infinity;
  const x0 = Math.max(0, Math.floor(pcx) - 5);
  const x1 = Math.min(W - 1, Math.floor(pcx) + 5);
  const y0 = Math.max(0, Math.floor(pcy) - 5);
  const y1 = Math.min(H - 1, Math.floor(pcy) + 5);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const t = getBlock(x, y);
      if (t === T.CRAFT_TABLE || t === T.FURNACE || t === T.ALCHEMY ||
          t === T.ENCHANT_TABLE || t === T.CONTROLLER || t === T.VOID_MINER ||
          t === T.CULTIVATOR) {
        const d = Math.hypot(x - pcx, y - pcy);
        if (d < bestD) { bestD = d; best = { x, y, t }; }
      }
    }
  }
  if (!best) { toast('附近没有工作方块'); return; }
  if (best.t === T.CRAFT_TABLE) openCraftingTable(best.x, best.y);
  else if (best.t === T.FURNACE) openFurnace(best.x, best.y);
  else if (best.t === T.ALCHEMY) openAlchemy(best.x, best.y);
  else if (best.t === T.ENCHANT_TABLE) openEnchantTable(best.x, best.y);
  else if (best.t === T.CONTROLLER) openController(best.x, best.y);
  else if (best.t === T.VOID_MINER) openMinerMenu(best.x, best.y);
  else if (best.t === T.CULTIVATOR) openCultivatorMenu(best.x, best.y);
}
window._interact = openNearestStation;

const MINER_ORES = [
  { type: T.COAL,      need: 0 },
  { type: T.IRON,      need: 0 },
  { type: T.PAPER_ORE, need: 0 },
  { type: T.LAPIS_ORE, need: 1 },
  { type: T.GOLD,      need: 1 },
  { type: T.REDSTONE,  need: 1 },
  { type: T.DIAMOND,   need: 2 },
  { type: T.OBSIDIAN,  need: 3 }
];

function openMinerMenu(bx, by) {
  const m = S.machines.find(m => m.x === bx && m.y === by && m.kind === 'miner');
  if (!m) {
    S.machines.push({ kind:'miner', x:bx, y:by, lv:0, type:T.COAL, timer:0 });
    toast('⛏ 虚空矿机已激活');
    return;
  }
  const box = document.getElementById('popBox');
  let html = '<h4>⛏ 虚空矿机 Lv.' + (m.lv || 0) + '</h4>';
  html += '<div class="d">每秒产出：' + (1 + (m.lv || 0) * 0.2).toFixed(2) + ' 个</div>';
  html += '<div style="font-size:11px;color:#9988bb;margin:8px 0">选择产出：</div>';
  for (const o of MINER_ORES) {
    if (o.need > (m.lv || 0)) continue;
    const oi = INFO[o.type];
    const sel = m.type === o.type;
    html += `<button data-set="${o.type}" class="${sel ? 'gold' : ''}">${oi.n}</button>`;
  }
  const upCost = 50 + (m.lv || 0) * 30;
  html += `<button class="gold" id="mUp">升级 Lv.${(m.lv||0)+1}（✨${upCost}）</button>`;
  html += '<button class="red" id="mClose">关 闭</button>';
  box.innerHTML = html;
  document.getElementById('pop').classList.add('on');
  box.querySelectorAll('button[data-set]').forEach(b => {
    b.onclick = () => { m.type = parseInt(b.dataset.set); openMinerMenu(bx, by); };
  });
  box.querySelector('#mUp').onclick = () => {
    if (S.pts < upCost) { toast('升华点不足'); return; }
    S.pts -= upCost;
    m.lv = (m.lv || 0) + 1;
    openMinerMenu(bx, by);
  };
  box.querySelector('#mClose').onclick = () => {
    document.getElementById('pop').classList.remove('on');
  };
}

function updateMachines(dt) {
  if (!S.machines) return;
  const speed = 1 + (S.machines.filter(m => m.kind === 'controller').length) * 0.1;
  for (const m of S.machines) {
    if (m.kind === 'miner') {
      m.timer = (m.timer || 0) + dt * speed;
      const interval = 1 / (1 + (m.lv || 0) * 0.2);
      if (m.timer >= interval) {
        m.timer = 0;
        const t = m.type || T.COAL;
        if (t === T.PAPER_ORE) {
          S.paper[0] = (S.paper[0] || 0) + 3;
          S.tp += 3;
          if (Math.random() < 0.2) S.paperSeed = (S.paperSeed || 0) + 1;
        } else {
          S.inventory[t] = (S.inventory[t] || 0) + 1;
        }
      }
    } else if (m.kind === 'cultivator') {
      m.timer = (m.timer || 0) + dt * speed;
      if (m.timer >= 5) {
        m.timer = 0;
        const cx = m.x, cy = m.y;
        for (let dx = -4; dx <= 4; dx++) {
          for (let dy = 0; dy <= 4; dy++) {
            const tx = cx + dx, ty = cy + dy;
            const t = getBlock(tx, ty);
            if ((t === T.GRASS || t === T.DIRT) && getBlock(tx, ty-1) === T.AIR) {
              if (S.paperSeed > 0) {
                S.paperSeed--;
                S.fields.push({ x: tx, y: ty - 1, grow: 0, type: 0 });
                setBlock(tx, ty, T.PAPER_SOIL);
                updateInvUI();
              }
              return;
            }
            if (t === T.PAPER_SOIL) {
              for (const f of S.fields) {
                if (f.x === tx && f.y === ty - 1 && f.grow >= 1) {
                  f.grow = 0;
                  const y2 = Math.floor((2 + Math.random() * 4) * luckMul());
                  S.paper[0] = (S.paper[0] || 0) + y2;
                  S.tp += y2;
                  return;
                }
              }
            }
          }
        }
      }
    }
  }
  if (S.machines.length > 0 && Math.random() < 0.05) updateInvUI();
}

function summonBoss(kind) {
  const boss = BOSSES.find(b => b.id === kind);
  if (!boss) { toast('未知 Boss'); return; }
  const p = S.player;
  const dir = Math.random() < 0.5 ? -1 : 1;
  const bx = p.x / BS + dir * 10;
  const by = p.y / BS - 2;
  for (let dy = 0; dy < 12; dy++) {
    const ty = Math.floor(by + dy);
    const tx = Math.floor(bx);
    if (tx < 2 || tx > W - 3 || ty < 2 || ty > H - 5) continue;
    if (!isSolid(tx, ty) && isSolid(tx, ty + 1)) {
      S.boss = {
        x: bx * BS, y: (ty - 1) * BS,
        w: BS * 1.4, h: BS * 2.6,
        vx: 0, vy: 0, onGround: false,
        hp: boss.hp, maxHp: boss.hp,
        def: boss, hurtFlash: 0, attackCd: 1.5, timer: 120
      };
      toast('👹 ' + boss.n + ' 出现！');
      log('召唤：' + boss.n);
      return;
    }
  }
  toast('召唤失败，空间不足');
}

function startFishing() {
  if (!S) return;
  const rod = S.selected;
  const rodInfo = INFO[rod];
  if (!rodInfo || !rodInfo.rod) {
    toast('需要装备钓竿到手上');
    return;
  }
  // 检查附近有水
  const p = S.player;
  const pcx = Math.floor((p.x + p.w / 2) / BS);
  const pcy = Math.floor((p.y + p.h / 2) / BS);
  let hasWater = false;
  for (let dx = -6; dx <= 6; dx++) {
    for (let dy = -3; dy <= 3; dy++) {
      if (getBlock(pcx + dx, pcy + dy) === T.WATER) { hasWater = true; break; }
    }
    if (hasWater) break;
  }
  if (!hasWater) { toast('附近没有水'); return; }

  if (S.fishing.state === 'idle') {
    S.fishing.state = 'waiting';
    S.fishing.wait = 5 + Math.random() * 10;
    S.fishing.timer = 0;
    toast('🎣 抛竿…');
  } else if (S.fishing.state === 'waiting') {
    if (S.fishing.timer < S.fishing.wait) {
      toast('还没上钩');
      return;
    }
    // 收杆
    const rodLv = rodInfo.rod;
    const luck = luckMul();
    const r = Math.random();
    let loot = null;
    let name = '';
    if (r < 0.5) { loot = T.FISH_RAW; name = '生鱼'; }
    else if (r < 0.75) { loot = T.BONE_DUST; name = '骨粉'; }
    else if (r < 0.85 + rodLv * 0.02) { loot = T.CHEST; name = '宝箱'; }
    else if (r < 0.92 + rodLv * 0.02) { loot = T.BOOK_ENCHANT; name = '附魔书'; }
    else if (r < 0.97) { loot = T.POTION_REGEN; name = '再生药水'; }
    else {
      // 稀有：装备
      const equips = [T.EQ_AMULET_CRIT, T.EQ_AMULET_LUCK, T.EQ_AMULET_MAGIC,
                      T.EQ_HELM_LEGEND, T.EQ_CHEST_LEGEND, T.EQ_LEG_LEGEND];
      loot = equips[Math.floor(Math.random() * equips.length)];
      name = INFO[loot].n;
    }
    // 宝箱给额外奖励
    if (loot === T.CHEST) {
      const g = Math.floor((200 + Math.random() * 800) * goldMul());
      S.gold += g; S.tg += g;
      toast('🎣 钓到宝箱 +' + fmt(g) + ' 金币');
    }
    if (loot === T.CHEST || loot === T.BOOK_ENCHANT || INFO[loot].eq) {
      addDrop(pcx, pcy, loot, 1);
    } else {
      addDrop(pcx, pcy, loot, 1);
    }
    S.stat.fishCaught = (S.stat.fishCaught || 0) + 1;
    log('钓鱼：' + name);
    toast('🎣 ' + name);
    S.fishing.state = 'idle';
    S.fishing.timer = 0;
  }
}

function updateFishing(dt) {
  if (!S || !S.fishing) return;
  if (S.fishing.state === 'waiting') {
    S.fishing.timer += dt;
  }
}

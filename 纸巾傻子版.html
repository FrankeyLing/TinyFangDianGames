<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>抽纸巾</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
body {
  background: radial-gradient(circle at 50% 30%, #2a1a4a, #0a0a15 70%);
  color: #fff;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  text-align: center;
  overflow: hidden;
}

.title { font-size: 24px; color: #ffd97a; margin-bottom: 6px; letter-spacing: 4px; text-shadow: 0 0 20px #ffd97a88; }
.bigGold { font-size: 56px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px #ffd70099; line-height: 1; margin: 10px 0; }
.label { font-size: 14px; color: #9988bb; letter-spacing: 2px; margin-bottom: 20px; }

#bigBtn {
  width: 220px; height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 30%, #ffcc44, #ff7722 60%, #cc4400);
  border: 8px solid #ffd700;
  font-size: 72px;
  cursor: pointer;
  transition: transform .08s, box-shadow .15s;
  box-shadow: 0 0 60px #ff9a3c88, inset 0 -10px 30px #00000044;
  margin: 10px 0 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#bigBtn:active { transform: scale(0.9); box-shadow: 0 0 100px #ffd700cc, inset 0 -10px 30px #00000066; }

.perClick { font-size: 15px; color: #90ee90; margin-bottom: 20px; font-weight: 700; }

button.upg {
  background: linear-gradient(180deg, #6a4bc4, #4a2b84);
  color: #fff;
  border: 2px solid #8866cc;
  border-radius: 12px;
  padding: 14px 22px;
  font-size: 16px;
  font-weight: 700;
  margin: 5px;
  min-width: 260px;
  min-height: 56px;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
button.upg:disabled {
  background: #222;
  color: #555;
  border-color: #333;
}
button.upg.ready {
  background: linear-gradient(180deg, #38a169, #1a5a35);
  border-color: #68d391;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 #68d391; }
  50% { box-shadow: 0 0 20px #68d391; }
}

#rebirth {
  display: none;
  background: linear-gradient(180deg, #ff9a3c, #cc4400);
  color: #fff;
  border: 3px solid #ffd700;
  border-radius: 14px;
  padding: 18px 30px;
  font-size: 20px;
  font-weight: 900;
  margin-top: 24px;
  min-width: 280px;
  cursor: pointer;
  font-family: inherit;
  animation: shine 1.2s infinite;
}
#rebirth.show { display: block; }
@keyframes shine {
  0%, 100% { box-shadow: 0 0 30px #ffd70088; }
  50% { box-shadow: 0 0 60px #ffd700ff; }
}

.pop {
  position: fixed;
  pointer-events: none;
  font-weight: 900;
  color: #ffd700;
  font-size: 28px;
  text-shadow: 0 0 12px #ffd700;
  animation: rise 1s ease-out forwards;
  z-index: 99;
}
@keyframes rise {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-120px) scale(1.3); }
}

.saveTip {
  position: fixed;
  bottom: 10px;
  right: 12px;
  font-size: 11px;
  color: #665588;
  opacity: 0.5;
}
</style>
</head>
<body>

<div class="title">🧻 抽纸巾</div>
<div class="bigGold" id="gold">0</div>
<div class="label">金币</div>

<button id="bigBtn">👉</button>
<div class="perClick" id="perClick">点一下 +1 金币</div>

<button class="upg" id="upg1">👆 点击 +1</button>
<button class="upg" id="upg2">🤖 自动 0/秒</button>
<button class="upg" id="upg3">💰 售价 1 金</button>

<button id="rebirth">🌟 转生！变强 10 倍</button>

<div class="saveTip" id="saveTip">已自动保存</div>

<script>
// ========== 游戏状态 ==========
var G = {
  gold: 0,
  paper: 0,
  clickLv: 0,
  autoLv: 0,
  priceLv: 0,
  rebirths: 0,
  permBonus: 0   // 转生永久加成
};

// ========== 存档 ==========
function save() {
  try {
    localStorage.setItem('sillyPaperV1', JSON.stringify(G));
  } catch (e) {}
}
function load() {
  try {
    var s = localStorage.getItem('sillyPaperV1');
    if (s) {
      var d = JSON.parse(s);
      for (var k in G) if (d[k] !== undefined) G[k] = d[k];
    }
  } catch (e) {}
}
load();

// ========== 元素 ==========
var $ = function(id) { return document.getElementById(id); };
var goldEl = $('gold');
var perClickEl = $('perClick');
var bigBtn = $('bigBtn');
var upg1 = $('upg1');
var upg2 = $('upg2');
var upg3 = $('upg3');
var rebirth = $('rebirth');
var saveTip = $('saveTip');

// ========== 数值 ==========
function clickPower() { return 1 + G.clickLv + G.permBonus; }
function autoPower()  { return G.autoLv + G.permBonus; }
function pricePer()   { return 1 + G.priceLv + G.permBonus; }

function gainPerClick() { return clickPower() * pricePer(); }

function cost1() { return Math.floor(10 * Math.pow(1.5, G.clickLv)); }
function cost2() { return Math.floor(30 * Math.pow(1.5, G.autoLv)); }
function cost3() { return Math.floor(50 * Math.pow(1.6, G.priceLv)); }

// ========== 数字格式化 ==========
function fmt(n) {
  n = Math.floor(n);
  if (n < 1000) return n.toString();
  if (n < 1e6)  return (n/1e3).toFixed(1) + 'k';
  if (n < 1e9)  return (n/1e6).toFixed(1) + 'M';
  if (n < 1e12) return (n/1e9).toFixed(1) + 'B';
  if (n < 1e15) return (n/1e12).toFixed(1) + 'T';
  if (n < 1e18) return (n/1e15).toFixed(1) + 'Qa';
  if (n < 1e21) return (n/1e18).toFixed(1) + 'Qi';
  return n.toExponential(2);
}

// ========== 浮动数字 ==========
function popup(x, y, text) {
  var el = document.createElement('div');
  el.className = 'pop';
  el.style.left = (x - 40) + 'px';
  el.style.top = (y - 50) + 'px';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 1000);
}

// ========== 抽纸按钮 ==========
bigBtn.addEventListener('click', function(e) {
  var g = gainPerClick();
  G.gold += g;
  G.paper += clickPower();
  popup(e.clientX, e.clientY, '+' + fmt(g));
  render();
});

// ========== 升级 ==========
upg1.onclick = function() {
  var c = cost1();
  if (G.gold < c) return;
  G.gold -= c;
  G.clickLv++;
  render(); save();
};

upg2.onclick = function() {
  var c = cost2();
  if (G.gold < c) return;
  G.gold -= c;
  G.autoLv++;
  render(); save();
};

upg3.onclick = function() {
  var c = cost3();
  if (G.gold < c) return;
  G.gold -= c;
  G.priceLv++;
  render(); save();
};

// ========== 转生 ==========
rebirth.onclick = function() {
  if (G.gold < 100000) return;
  var gain = Math.max(1, Math.floor(Math.sqrt(G.gold / 100000)) * 10);
  G.rebirths++;
  G.permBonus += gain;

  // 重置本轮
  G.gold = 0;
  G.paper = 0;
  G.clickLv = 0;
  G.autoLv = 0;
  G.priceLv = 0;

  alert('转生成功！\n永久加成 +' + gain + '\n累计加成 +' + G.permBonus);

  render(); save();
};

// ========== 自动抽纸 ==========
setInterval(function() {
  var a = autoPower();
  if (a > 0) {
    var g = a * pricePer();
    G.gold += g;
    G.paper += a;
  }
  render();
}, 1000);

// ========== 自动保存 ==========
setInterval(function() {
  save();
  saveTip.textContent = '💾 已保存 ' + new Date().toLocaleTimeString();
}, 5000);

// ========== 渲染 ==========
function render() {
  goldEl.textContent = fmt(G.gold);
  perClickEl.textContent = '点一下 +' + fmt(gainPerClick()) + ' 金币';

  var c1 = cost1(), c2 = cost2(), c3 = cost3();

  upg1.textContent = '👆 点击 +' + clickPower() + '（' + fmt(c1) + ' 金）';
  upg2.textContent = '🤖 自动 ' + autoPower() + '/秒（' + fmt(c2) + ' 金）';
  upg3.textContent = '💰 售价 ' + pricePer() + ' 金（' + fmt(c3) + ' 金）';

  upg1.disabled = G.gold < c1;
  upg2.disabled = G.gold < c2;
  upg3.disabled = G.gold < c3;

  if (!upg1.disabled) upg1.classList.add('ready'); else upg1.classList.remove('ready');
  if (!upg2.disabled) upg2.classList.add('ready'); else upg2.classList.remove('ready');
  if (!upg3.disabled) upg3.classList.add('ready'); else upg3.classList.remove('ready');

  if (G.gold >= 100000) {
    rebirth.classList.add('show');
    var gain = Math.max(1, Math.floor(Math.sqrt(G.gold / 100000)) * 10);
    rebirth.textContent = '🌟 转生！永久 +' + gain;
  } else {
    rebirth.classList.remove('show');
  }
}

// ========== 页面关闭前保存 ==========
window.addEventListener('beforeunload', save);

// ========== 启动 ==========
render();
</script>
</body>
</html>
